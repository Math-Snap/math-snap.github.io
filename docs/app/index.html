<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Math Snap</title>
<meta name="description" content="Math Snap: פותר תרגילים במתמטיקה עם הסבר לכל שלב.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Snap">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
/* Layout: phone app — app bar, one working card per tab, results below, bottom navigation.
   Identity: a math notebook. Ink-blue pen, highlighter-yellow answers, faint graph paper. */
@font-face{font-family:"Rubik";src:url("fonts/Rubik.ttf") format("truetype");font-weight:300 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf") format("truetype");font-weight:100 800;font-display:swap}
:root{
  --bg:#F2F4F9; --grid:#E6EAF3; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#141B2D; --muted:#647089; --line:#E3E7F0;
  --pen:#3346E0; --pen-press:#2533B8; --on-pen:#FFFFFF; --pen-soft:#ECEFFE; --mark:#FFE27A;
  --ok:#11845B; --ok-soft:#E5F5EE; --warn:#B03A1E; --warn-soft:#FDECE7;
  --shadow:0 1px 2px rgba(20,27,45,.05),0 6px 20px rgba(20,27,45,.07);
  --sans:"Rubik",Roboto,"Noto Sans Hebrew",system-ui,sans-serif; --mono:"JetBrains Mono","Roboto Mono",ui-monospace,monospace;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D111C; --grid:#141A28; --surface:#161C2B; --surface-2:#1C2335; --ink:#E9EDF7; --muted:#98A2BC; --line:#262E44;
  --pen:#8E9CFF; --pen-press:#A9B4FF; --on-pen:#0B0F1A; --pen-soft:#1F2850; --mark:#6E5A12;
  --ok:#5FD39B; --ok-soft:#12302A; --warn:#FF9A7A; --warn-soft:#3A1D16;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D111C; --grid:#141A28; --surface:#161C2B; --surface-2:#1C2335; --ink:#E9EDF7; --muted:#98A2BC; --line:#262E44;
  --pen:#8E9CFF; --pen-press:#A9B4FF; --on-pen:#0B0F1A; --pen-soft:#1F2850; --mark:#6E5A12;
  --ok:#5FD39B; --ok-soft:#12302A; --warn:#FF9A7A; --warn-soft:#3A1D16;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 112px;display:flex;flex-direction:column;gap:16px}

/* app bar */
.appbar{display:flex;align-items:center;gap:12px;padding:6px 2px 2px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--pen);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(51,70,224,.28)}
.logo svg{width:28px;height:28px}
h1{margin:0;font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.35}
.lang{display:flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow);flex:none}
.lang button{border:0;background:none;color:var(--muted);font:600 13px/1 var(--sans);padding:9px 12px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--pen);color:var(--on-pen)}

/* cards */
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.phead h2{margin:0;font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{border:0;border-radius:16px;min-height:56px;padding:0 16px;font:600 17px/1 var(--sans);background:var(--pen);color:var(--on-pen);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.98);background:var(--pen-press)}
.btn svg{width:22px;height:22px;flex:none}
[dir="rtl"] .btn .go{transform:scaleX(-1)}
.tile{border:0;border-radius:16px;background:var(--pen-soft);color:var(--pen);padding:14px 10px;font:600 15px/1.2 var(--sans);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.tile .ic{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.tile svg{width:24px;height:24px}

/* inputs */
.lbl{font:600 13px/1.3 var(--sans);color:var(--muted)}
textarea,input,select{width:100%;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2);color:var(--ink);font:18px/1.55 var(--mono);padding:14px;transition:border-color .15s ease,background .15s ease}
textarea{min-height:104px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.7}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--pen);background:var(--surface)}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
select{font:16px/1.3 var(--sans)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* example chips and tool chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px/1.2 var(--sans);white-space:nowrap}
.chip.math{font-family:var(--mono);font-size:14px}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chips.wrapchips .chip{white-space:normal;text-align:start;max-width:100%}
.exlabel{font-size:12px;font-weight:600;color:var(--muted);margin:0}

/* status and detected */
.status{margin:0;font-size:14px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.status.bad{color:var(--warn);background:var(--warn-soft)}
.hint{margin:0;font-size:14px;color:var(--pen);background:var(--pen-soft);border-radius:12px;padding:10px 12px;font-weight:500}

/* results */
.result{display:flex;flex-direction:column;gap:14px}
.prob{font:600 15px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ans{background:var(--surface-2);border-radius:16px;padding:14px 16px}
.askbox{background:var(--pen-soft);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.askbox small{font:700 13px/1.4 var(--sans);color:var(--pen)}
.askbox div{font:700 20px/1.6 var(--mono);overflow-wrap:anywhere}
.askbox p{margin:0;color:var(--muted);font-size:14px}
.ans small{display:block;font:600 12px/1 var(--sans);color:var(--ok);margin-bottom:8px}
.ans div{display:inline;font:700 22px/1.7 var(--mono);white-space:pre-line;overflow-wrap:anywhere;
  background-image:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.ans div[dir="rtl"]{font-family:var(--sans)}
.err{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;font-weight:500}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column}
.steps li{position:relative;padding-inline-start:40px;padding-bottom:16px;counter-increment:s;overflow-wrap:anywhere}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--pen-soft);color:var(--pen);font:700 13px/26px var(--sans);text-align:center}
.steps li::after{content:"";position:absolute;inset-inline-start:12.5px;top:30px;bottom:4px;width:1.5px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps .math{font:16px/1.6 var(--mono);white-space:pre-wrap}
.steps .why{font:13px/1.45 var(--sans);color:var(--muted);margin-top:2px}
[dir="rtl"] [dir="ltr"]{text-align:right}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}

/* notes / formulas */
.notes{background:var(--pen-soft);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6}
.notes summary{font-weight:600;color:var(--pen);cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.notes summary::-webkit-details-marker{display:none}
.notes summary::after{content:"";width:8px;height:8px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-inline-start:auto;transition:transform .2s ease}
.notes[open] summary::after{transform:rotate(-135deg)}
.notes summary svg{width:18px;height:18px;flex:none}
.notes .body{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.notes b{color:var(--pen)}
.notes table{border-collapse:collapse;width:100%}
.notes td{padding:6px 4px;border-bottom:1px solid rgba(51,70,224,.15);vertical-align:top}
.notes tr:last-child td{border-bottom:0}
.notes td.f{font-family:var(--mono);white-space:nowrap}

/* geometry fields, figure, proof table */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.fields input{text-align:center;font-size:19px;font-weight:600}
.fig{background:var(--surface-2);border-radius:16px;padding:10px}
.fig svg{direction:ltr;width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.proofwrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table.proof{width:100%;border-collapse:collapse;font-size:14px;line-height:1.5}
.proof th{background:var(--pen-soft);color:var(--pen);padding:10px 8px;font-weight:700;text-align:start}
.proof td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.proof td.claim{font-family:var(--mono);font-weight:500}
.proof td.claim.he{font-family:var(--sans)}
.proof td.n{width:2em;text-align:center}
.proof td.n::before{content:attr(data-n);display:inline-block;min-width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--muted);font:600 12px/22px var(--sans)}
.proof td:last-child{color:var(--muted)}
.section-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink);margin:0}
.section-title svg{width:18px;height:18px;color:var(--pen)}

/* bottom navigation */
.bottomnav{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(20,27,45,.06);
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bottomnav button{border:0;background:none;color:var(--muted);font:600 13px/1 var(--sans);display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.bottomnav .pill{width:64px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s ease}
.bottomnav svg{width:22px;height:22px}
.bottomnav button[aria-selected="true"]{color:var(--pen)}
.bottomnav button[aria-selected="true"] .pill{background:var(--pen-soft)}
/* account */
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;align-items:center;gap:12px;font-size:15px}
.perks .ic{width:36px;height:36px;border-radius:12px;background:var(--pen-soft);color:var(--pen);display:grid;place-items:center;flex:none}
.perks svg{width:20px;height:20px}
.btn.google{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.google svg{width:20px;height:20px}
.btn.quiet{background:var(--pen-soft);color:var(--pen)}
.btn:disabled{opacity:.55}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.authform{display:flex;flex-direction:column;gap:10px}
.authform input{font-family:var(--sans);font-size:17px;text-align:start}
.linkbtn{border:0;background:none;color:var(--pen);font:600 14px/1.3 var(--sans);padding:6px 0;text-align:start}
.linkrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.profile{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--pen);color:var(--on-pen);display:grid;place-items:center;font:700 20px/1 var(--sans);flex:none}
.profile .who{flex:1;min-width:0}
.profile .who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile .who span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.syncpill.wait{background:var(--surface-2);color:var(--muted)}
.syncpill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.setrow{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.setrow .txt{flex:1;min-width:0}
.setrow b{display:block;font-size:15px;font-weight:600}
.setrow span{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.switch{position:relative;width:52px;height:32px;flex:none;direction:ltr}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%;padding:0}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s ease}
.switch .track::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s ease}
.switch input:checked + .track{background:var(--pen)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:2px solid var(--pen);outline-offset:2px}
.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hhead{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:500}
.hhead svg{width:16px;height:16px;color:var(--pen)}
.hhead .sp{flex:1}
.star{border:0;background:none;padding:4px;color:var(--muted);display:grid;place-items:center}
.star svg{width:22px;height:22px}
.hhead .star svg{color:inherit}
.star[aria-pressed="true"]{color:#E5A100}
.star[aria-pressed="true"] svg{fill:currentColor}
.hin{font:500 15px/1.5 var(--mono);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.hin.he{font-family:var(--sans)}
.hans{font:700 15px/1.6 var(--mono);overflow-wrap:anywhere}
.hans span{background-image:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hnote{background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.hact{display:flex;gap:6px;flex-wrap:wrap}
.hact button{border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px/1 var(--sans)}
.hact button.danger{color:var(--warn)}
.hact button.primary{background:var(--pen-soft);color:var(--pen)}
.hedit{display:flex;flex-direction:column;gap:8px}
.hedit textarea{min-height:70px;font-family:var(--sans);font-size:15px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.savebar{display:flex;align-items:center;gap:10px;background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:8px 8px 8px 12px;font-size:14px;font-weight:600}
[dir="rtl"] .savebar{padding:8px 12px 8px 8px}
.savebar .sp{flex:1}
.savebar .star{color:var(--ok)}
.savebar.out{background:var(--surface-2);color:var(--muted);font-weight:500}
/* background choices */
body[data-bg="dots"]{background-image:radial-gradient(var(--grid) 1.4px,transparent 1.7px);background-size:18px 18px}
body[data-bg="lines"]{background-image:linear-gradient(transparent 27px,var(--grid) 27px,var(--grid) 28px);background-size:100% 28px}
body[data-bg="plain"]{background-image:none}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
/* full-screen layers */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .inner{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheethead{display:flex;align-items:center;gap:12px;padding-top:6px}
.sheethead h2{flex:1;margin:0;font-size:22px;font-weight:800}
.opt{display:flex;flex-direction:column;gap:10px}
.opt h3{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.bgtile{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font:500 13px/1 var(--sans);padding:0}
.bgtile i{width:64px;height:48px;border-radius:12px;background-color:var(--bg);box-shadow:0 0 0 1.5px var(--line);display:block}
.bgtile[aria-pressed="true"] i{box-shadow:0 0 0 2.5px var(--pen)}
.bgtile i.grid{background-image:linear-gradient(var(--muted) 1px,transparent 1px),linear-gradient(90deg,var(--muted) 1px,transparent 1px);background-size:10px 10px;opacity:.9}
.bgtile i.dots{background-image:radial-gradient(var(--muted) 1.2px,transparent 1.5px);background-size:9px 9px}
.bgtile i.lines{background-image:linear-gradient(transparent 11px,var(--muted) 11px,var(--muted) 12px);background-size:100% 12px}
.preview{display:flex;flex-direction:column;gap:12px}
.preview .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* welcome */
.welcome .inner{min-height:100%;justify-content:center;text-align:center;gap:20px}
.hero{position:relative;height:200px;display:grid;place-items:center}
.hero .logo{width:96px;height:96px;border-radius:30px}
.hero .logo svg{width:60px;height:60px}
.hero .float{position:absolute;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:8px 12px;font:600 15px/1 var(--mono);direction:ltr}
.hero .f1{top:14px;left:8%;transform:rotate(-6deg)}
.hero .f2{top:30px;right:6%;transform:rotate(5deg)}
.hero .f3{bottom:18px;left:14%;transform:rotate(4deg)}
.hero .f4{bottom:8px;right:12%;transform:rotate(-4deg)}
.hero .f4 span{background-image:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%)}
.welcome h2{margin:0;font-size:28px;font-weight:800;line-height:1.15;text-wrap:balance}
.welcome p.lead{margin:0;color:var(--muted);font-size:16px;text-wrap:balance}
.welcome .acts{display:flex;flex-direction:column;gap:10px;text-align:start}
.welcome .skip{border:0;background:none;color:var(--muted);font:600 15px/1 var(--sans);padding:12px}
.welcome .lang{align-self:center}
@media (prefers-reduced-motion:no-preference){.hero .float{animation:bob 5s ease-in-out infinite}.hero .f2{animation-delay:-1.2s}.hero .f3{animation-delay:-2.4s}.hero .f4{animation-delay:-3.6s}}
@keyframes bob{50%{translate:0 -6px}}
/* theorem bank */
.bank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bank li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.bank .num{flex:none;min-width:28px;height:28px;border-radius:50%;background:var(--pen-soft);color:var(--pen);font:700 13px/28px var(--sans);text-align:center}
.bank .t{flex:1;min-width:0;font-size:15px;line-height:1.5}
.bank .t small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:2px}
.bank .t b{color:var(--pen);font-weight:700}
.bank mark{background:var(--mark);color:inherit;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    </div>
    <p class="status" id="ocrStatus" hidden></p>
    <label class="lbl" for="problem" data-t="problemLbl"></label>

2x + 5 = 17</textarea>

  </section>

  <section id="results" class="panel" aria-live="polite"></section>

  <!-- GEOMETRY -->

    </div>
  </section>

  <section id="toolPanel" class="panel" hidden>
    <p class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18L12 4z"/></svg><span data-t="shape"></span></p>
    <div class="chips" id="groupChips"></div>
    <div class="chips wrapchips" id="toolChips"></div>
    <label class="vh" for="shape">shape</label><select id="shape" class="vh"></select>
    <details class="notes" id="geoNotesWrap" hidden><summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h6"/></svg><span data-t="reminder"></span></summary><div class="body" id="geoNotes"></div></details>

function renderToolChips(){
  const cur = $("shape").value, curG = SH[cur] ? SH[cur].g : undefined;
  const gBox = $("groupChips"), tBox = $("toolChips"); gBox.innerHTML = ""; tBox.innerHTML = "";
  for (const [g, label] of GROUPS) {
    gBox.append(chip(pick(...label), "", () => {

      $("shape").value = first; buildFields(false); $("geoResults").innerHTML = ""; $("geoResults").hidden = true;

function proofTable(rows){
  const W=TW(), wrap=el("div","proofwrap"), tb=document.createElement("table"); tb.className="proof";
  const hr=document.createElement("tr"); ["#", W.claim, W.reason].forEach(h=>hr.append(el("th",null,h)));
  const th=document.createElement("thead"); th.append(hr); tb.append(th);
  const body=document.createElement("tbody");
  rows.forEach(([c,why],i)=>{ const tr=document.createElement("tr");
    const nc = el("td","n"); nc.dataset.n = String(i+1); tr.append(nc, dirOf(el("td", HEB.test(c) ? "claim he" : "claim", c), c), dirOf(el("td",null,why), why)); body.append(tr); });

function solveNow(quiet, noSave){
  const out = $("results"); out.innerHTML = "";
  let res;
  try { res = Solver.solve($("problem").value, lang); } catch(e) { res = [{problem:"", error:T("crash")}]; }
  if (!res.length) { out.append(el("p","hint",T("empty"))); out.hidden=false; return; }
  res.forEach((r, i) => {
    const box = el("div","result");
    if (i) out.append(el("hr"));
    box.append(dirOf(el("div","prob",(res.length>1 ? "("+String.fromCharCode(97+i)+")  " : "") + r.problem), ""));
    if (r.error) box.append(dirOf(el("div","err",r.error), r.error));
    else {
      const a = el("div","ans"); a.append(el("small",null,T("answer")), dirOf(el("div",null,r.answer), r.answer)); box.append(a);
      if (r.steps && r.steps.length) {
        const ol = el("ol","steps");
        r.steps.forEach(([c, why]) => {
          const li = el("li"); li.append(dirOf(el("div","math",c), c));
          if (why) li.append(dirOf(el("div","why",why), why));
          ol.append(li);
        });
        box.append(ol);
      }
    }
    out.append(box);
  });
  if (!quiet) {
    const ok = res.filter(r => !r.error);
    let id = null;
    if (ok.length && !noSave) id = saveProblem({kind:"solve", input:$("problem").value.trim(), answer: ok.map(r => plain(r.answer)).join("   ;   ")});
    if (ok.length) out.prepend(saveBar(id));
  }
  out.hidden = $("solvePanel").hidden;
  if (!quiet) out.scrollIntoView({behavior:"smooth", block:"start"});
}
$("solve").onclick = () => solveNow();

const TW = () => TRW[lang];
const K4 = ["A","B","C","D"];
function checkAngles(v){ const W=TW(); for (const k of K4) if (v[k]!=null && !(v[k]>0 && v[k]<180)) throw W.range; }

function trapMissing(v){
  const W=TW(); checkAngles(v);
  const given = K4.filter(k=>v[k]!=null);
  if (!given.length) throw W.needLeg;
  const rows = [[W.trap, W.given], [LRI(given.map(k=>"∢"+k+" = "+R(v[k])+"°").join(" ,  ")), W.given]];
  for (const [p,q] of [["A","D"],["B","C"]]) {
    if (v[p]==null && v[q]==null) throw W.needLeg;
    if (v[p]!=null && v[q]!=null) { const x=v[p]+v[q]; if (Math.abs(x-180)>1e-9) throw W.legBad(p,q,R(x)); continue; }
    const [kn, ms] = v[p]!=null ? [p,q] : [q,p];
    v[ms] = 180 - v[kn];
    rows.push([LRI("∢"+ms+" = 180° − ∢"+kn+" = 180 − "+R(v[kn])+" = "+R(v[ms])+"°"), W.legThm]);
  }
  const missing = K4.filter(k=>!given.includes(k));
  if (missing.length) rows.push([LRI("∢A + ∢B + ∢C + ∢D = "+K4.map(k=>R(v[k])).join(" + ")+" = 360° ✓"), W.quad]);
  return { rows, title:W.missing, answer: missing.length ? missing.map(k=>LRI("∢"+k+" = "+R(v[k])+"°")).join("    ") : W.allGiven,
           angles:v, computed:missing, par:[true,false] };
}

function trapCheck(v){
  const W=TW(); checkAngles(v);
  const given = K4.filter(k=>v[k]!=null);
  if (given.length < 3) throw W.need3;
  const rows = [[LRI(given.map(k=>"∢"+k+" = "+R(v[k])+"°").join(" ,  ")), W.given]];
  const sum = given.reduce((t,k)=>t+v[k],0);
  let computed = [];
  if (given.length === 3) {
    if (sum >= 360) throw W.sumBad(R(sum));
    const m = K4.find(k=>v[k]==null); v[m] = 360 - sum; computed=[m];
    if (v[m] >= 180) throw W.range;
    rows.push([LRI("∢"+m+" = 360° − "+given.map(k=>"∢"+k).join(" − ")+" = 360 − "+given.map(k=>R(v[k])).join(" − ")+" = "+R(v[m])+"°"), W.quad]);
  } else if (Math.abs(sum-360) > 1e-9) throw W.sumBad(R(sum));
  const s1 = v.A+v.D, p1 = Math.abs(s1-180) < 1e-9;
  rows.push([LRI("∢A + ∢D = "+R(v.A)+" + "+R(v.D)+" = "+R(s1)+"°"+(p1?"":" ≠ 180°")), W.coint]);
  rows.push([LRI(p1 ? "AB ∥ DC" : "AB ∦ DC"), p1 ? W.par : W.notPar]);
  const s2 = v.A+v.B, p2 = Math.abs(s2-180) < 1e-9;
  rows.push([LRI("∢A + ∢B = "+R(v.A)+" + "+R(v.B)+" = "+R(s2)+"°"+(p2?"":" ≠ 180°")), W.coint]);
  rows.push([LRI(p2 ? "AD ∥ BC" : "AD ∦ BC"), p2 ? W.par : W.notPar]);
  const verdict = p1 !== p2 ? [W.isTrap, W.defTrap] : (p1 ? [W.isPara, W.twoPairs] : [W.notTrap, W.noPairs]);
  rows.push(verdict);
  return { rows, title:W.result, answer:verdict[0], angles:v, computed, par:[p1,p2] };
}

function trapSVG(ang, par, computed){
  const [p1,p2] = par;
  const P = p1 && p2 ? {A:[50,26],B:[190,26],C:[240,124],D:[100,124]}
          : (p1 || p2) ? {A:[75,26],B:[185,26],C:[245,124],D:[20,124]}
          : {A:[70,26],B:[200,44],C:[245,124],D:[20,124]};
  const pts = K4.map(k=>P[k].join(",")).join(" ");
  const off = {A:[-6,-8],B:[6,-8],C:[8,14],D:[-8,14]};
  const inner = k => { const cx=(P.A[0]+P.B[0]+P.C[0]+P.D[0])/4, cy=(P.A[1]+P.B[1]+P.C[1]+P.D[1])/4;
    return [P[k][0]+(cx-P[k][0])*0.22, P[k][1]+(cy-P[k][1])*0.28+5]; };
  const chev = (a,b,n) => { const mx=(P[a][0]+P[b][0])/2, my=(P[a][1]+P[b][1])/2, ang=Math.atan2(P[b][1]-P[a][1],P[b][0]-P[a][0])*180/Math.PI;
    let d=""; for (let i=0;i<n;i++){ const x=mx-3+i*7; d+=`M${x-4},${my-5} L${x+2},${my} L${x-4},${my+5} `; }
    return `<path d="${d}" transform="rotate(${ang} ${mx} ${my})" style="fill:none;stroke:var(--pen);stroke-width:2"/>`; };
  let svg = `<svg viewBox="0 0 270 150" role="img" aria-label="ABCD"><polygon points="${pts}" style="fill:var(--pen-soft);stroke:var(--pen);stroke-width:2.5;stroke-linejoin:round"/>`;
  if (p1) svg += chev("A","B",1) + chev("D","C",1);
  if (p2) svg += chev("A","D",2) + chev("B","C",2);
  for (const k of K4) {
    const [x,y]=P[k], [dx,dy]=off[k], [ix,iy]=inner(k);
    svg += `<text x="${x+dx}" y="${y+dy}" text-anchor="middle" style="fill:var(--ink);font:700 15px var(--sans)">${k}</text>`;
    const known = ang[k]!=null, isNew = computed.includes(k);
    svg += `<text x="${ix}" y="${iy}" text-anchor="middle" style="fill:${isNew?"var(--ok)":"var(--muted)"};font:${isNew?700:500} 13px var(--mono)">${known?R(ang[k])+"°":"?"}</text>`;
  }
  return svg + "</svg>";
}

function isoAngles(v){

  let A=v.A, B=v.B, computed;
  if (A!=null && B!=null) {
    if (Math.abs(A+2*B-180)>1e-9) throw g2("These angles don't fit: in an isosceles triangle ∢A + 2·∢B must be 180°.","הזוויות לא מתאימות: במשולש שווה שוקיים ∢A + 2·∢B חייב להיות 180°.");
    rows.push([LRI("∢C = ∢B = "+R(B)+"°"), R_BASE()]); computed=["C"];
  } else if (A!=null) {
    rows.push([LRI("∢B = ∢C"), R_BASE()]);
    rows.push([LRI("∢B + ∢C = 180° − ∢A = 180 − "+R(A)+" = "+R(180-A)+"°"), R_SUM180()]);
    B=(180-A)/2; rows.push([LRI("∢B = ∢C = "+R(180-A)+"° ÷ 2 = "+R(B)+"°"), g2("Two equal angles: divide by 2","שתי זוויות שוות: מחלקים ב-2")]);
    computed=["B","C"];
  } else {
    if (B>=90) throw g2("A base angle must be less than 90°.","זווית בסיס חייבת להיות קטנה מ-90°.");
    rows.push([LRI("∢C = ∢B = "+R(B)+"°"), R_BASE()]);
    A=180-2*B; rows.push([LRI("∢A = 180° − ∢B − ∢C = 180 − "+R(B)+" − "+R(B)+" = "+R(A)+"°"), R_SUM180()]);
    computed=["A","C"];
  }
  const ang={A,B,C:B};
  return { rows, title:g2("Angles","הזוויות"), answer: LRI("∢A = "+R(A)+"°   ∢B = ∢C = "+R(B)+"°"), svg: isoSVG(ang, computed) };
}

function isoHeight(v){
  lenPos(v,["L","b"]);
  if (v.L==null || v.b==null) throw g2("Enter the leg AB and the base BC.","הכניסו את השוק AB ואת הבסיס BC.");
  const L=v.L, b=v.b;
  if (b >= 2*L) throw g2("The base must be shorter than the two legs together (BC < 2·AB).","הבסיס חייב להיות קצר מסכום שתי השוקיים (BC < 2·AB).");
  const BD=b/2, h2=L*L-BD*BD, AD=Math.sqrt(h2), S=b*AD/2, P=2*L+b, u=usuf;
  const rows=[
    [isoGiven(), GV()],
    [LRI("AB = AC = "+R(L)+" ,  BC = "+R(b)+u(1)), GV()],
    [g2("AD is the median to the base BC", LRI("AD")+" תיכון לבסיס "+LRI("BC")), g2("Construction (draw the median to the base)","בנייה (נעביר את התיכון לבסיס)")],
    [LRI("BD = DC = BC ÷ 2 = "+R(b)+" ÷ 2 = "+R(BD)), g2("A median cuts the side into two equal parts","תיכון חוצה את הצלע לשני חלקים שווים")],
    [LRI("AD ⊥ BC   (∢ADB = 90°)"), g2("In an isosceles triangle, the median to the base is also the height","במשולש שווה שוקיים התיכון לבסיס הוא גם גובה")],
    [LRI("∢BAD = ∢CAD"), g2("In an isosceles triangle, the median to the base also bisects the vertex angle","במשולש שווה שוקיים התיכון לבסיס הוא גם חוצה זווית הראש")],
    [LRI("AD² + BD² = AB²"), g2("Pythagoras in the right triangle ABD","משפט פיתגורס במשולש ישר הזווית "+LRI("ABD"))],
    [LRI("AD = √(AB² − BD²) = √("+R(L)+"² − "+R(BD)+"²) = √"+R(h2)+eqOrApprox(AD)), g2("Substituting the sizes","הצבת גדלים")],
    [LRI("S = BC · AD ÷ 2 = "+R(b)+" · "+R(AD)+" ÷ 2"+eqOrApprox(S)+u(2)), g2("Triangle area = side × height to that side ÷ 2","שטח משולש = צלע × הגובה לצלע ÷ 2")],
    [LRI("P = AB + AC + BC = "+R(L)+" + "+R(L)+" + "+R(b)+" = "+R(P)+u(1)), g2("Perimeter = sum of the sides","היקף = סכום הצלעות")],
  ];
  return { rows, title:g2("Height, area and perimeter","גובה, שטח והיקף"),
    answer: [LRI("AD"+eqOrApprox(AD)+u(1)), LRI("S"+eqOrApprox(S)+u(2)), LRI("P = "+R(P)+u(1))].join("\n"),
    svg: isoSVG(null, [], {height:true, lens:{leg:R(L), half:R(BD), h:"AD"+eqOrApprox(AD).replace(" = ","=").replace(" ≈ ","≈")}}) };
}

function isoCheck(v){
  angRange(v,["A","B","C"]);
  const K=["A","B","C"], given=K.filter(k=>v[k]!=null);
  if (given.length<2) throw g2("Enter at least 2 of the 3 angles.","הכניסו לפחות 2 מתוך 3 הזוויות.");
  const rows=[givenRow(v,K)], computed=[];
  const sum=given.reduce((t,k)=>t+v[k],0);
  if (given.length===2) {
    if (sum>=180) throw g2("Two angles of a triangle must add up to less than 180°.","סכום שתי זוויות במשולש חייב להיות קטן מ-180°.");
    const m=K.find(k=>v[k]==null); v[m]=180-sum; computed.push(m);
    rows.push([LRI("∢"+m+" = 180° − "+given.map(k=>"∢"+k).join(" − ")+" = 180 − "+given.map(k=>R(v[k])).join(" − ")+" = "+R(v[m])+"°"), R_SUM180()]);
  } else if (Math.abs(sum-180)>1e-9) throw g2("The angles add up to "+R(sum)+"°, but a triangle's angles add up to 180°.","סכום הזוויות יוצא "+R(sum)+"°, אבל במשולש הסכום הוא 180°.");
  const same=(a,b)=>Math.abs(v[a]-v[b])<1e-9;
  const OPP={A:"BC",B:"AC",C:"AB"};
  const pairs=[["B","C"],["A","C"],["A","B"]].filter(([a,b])=>same(a,b));
  let ticks=[], verdict;
  if (pairs.length===3) {
    rows.push([LRI("∢A = ∢B = ∢C = 60°"), g2("Substituting the sizes","הצבת גדלים")]);
    rows.push([LRI("AB = BC = AC"), g2("Opposite equal angles lie equal sides","מול זוויות שוות מונחות צלעות שוות")]);
    verdict=[g2("ΔABC is equilateral (so it is also isosceles)", LRI("ΔABC")+" שווה צלעות (ולכן גם שווה שוקיים)"), g2("A triangle with all sides equal is equilateral","משולש שכל צלעותיו שוות נקרא שווה צלעות")];
    ticks=[["A","B",1],["B","C",1],["A","C",1]];
  } else if (pairs.length===1) {
    const [a,b]=pairs[0];
    rows.push([LRI("∢"+a+" = ∢"+b+" = "+R(v[a])+"°"), g2("Substituting the sizes","הצבת גדלים")]);
    const s1=OPP[a], s2=OPP[b];
    rows.push([LRI(s2+" = "+s1), g2("If a triangle has two equal angles, it is isosceles: opposite equal angles lie equal sides","אם במשולש יש שתי זוויות שוות אז הוא שווה שוקיים: מול זוויות שוות מונחות צלעות שוות")]);
    verdict=[g2("ΔABC is isosceles", LRI("ΔABC")+" שווה שוקיים"), g2("A triangle with two equal sides is isosceles","משולש בעל שתי צלעות שוות נקרא שווה שוקיים")];
    ticks=[[s1[0],s1[1],1],[s2[0],s2[1],1]];
  } else {
    verdict=[g2("ΔABC is not isosceles", LRI("ΔABC")+" לא שווה שוקיים"), g2("No two angles are equal, so no two sides are equal","אין בו שתי זוויות שוות, ולכן אין בו שתי צלעות שוות")];
  }
  rows.push(verdict);
  return { rows, title:g2("Result","מסקנה"), answer:verdict[0], svg: isoSVG(v, computed, {ticks}) };
}

const R_KITE_BD = () => g2("In a kite, the angles opposite the main diagonal are equal","בדלתון הזוויות מול האלכסון הראשי שוות זו לזו");
const R_QUAD = () => TW().quad;
function kiteAngles(v){
  const K=["A","B","C","D"]; angRange(v,K);
  const given=K.filter(k=>v[k]!=null);
  if (given.length<2) throw g2("Enter at least 2 angles: ∢A and ∢C, or ∢B (or ∢D) with ∢A or ∢C.","הכניסו לפחות 2 זוויות: ∢A ו-∢C, או ∢B (או ∢D) יחד עם ∢A או ∢C.");
  const rows=[[kiteGiven(), GV()], givenRow(v,K)], computed=[];
  if (v.B!=null && v.D!=null && Math.abs(v.B-v.D)>1e-9) throw g2("In a kite ∢B must equal ∢D.","בדלתון ∢B חייבת להיות שווה ל-∢D.");
  if (v.B!=null || v.D!=null) {
    const [kn,ms]= v.B!=null ? ["B","D"] : ["D","B"];
    if (v[ms]==null) { v[ms]=v[kn]; computed.push(ms); }
    rows.push([LRI("∢"+ms+" = ∢"+kn+" = "+R(v[kn])+"°"), R_KITE_BD()]);
    const miss=["A","C"].filter(k=>v[k]==null);
    if (miss.length===2) throw g2("Also enter ∢A or ∢C.","הכניסו גם את ∢A או את ∢C.");
    if (miss.length===1) {
      const m=miss[0], o=m==="A"?"C":"A"; v[m]=360-v[o]-2*v.B;
      if (!(v[m]>0)) throw TW().sumBad(R(v[o]+2*v.B));
      computed.push(m);
      rows.push([LRI("∢"+m+" = 360° − ∢"+o+" − ∢B − ∢D = 360 − "+R(v[o])+" − "+R(v.B)+" − "+R(v.D)+" = "+R(v[m])+"°"), R_QUAD()]);
    } else if (Math.abs(v.A+v.C+2*v.B-360)>1e-9) throw TW().sumBad(R(v.A+v.C+2*v.B));
  } else {
    if (v.A==null || v.C==null) throw g2("Enter ∢A and ∢C, or one of ∢B / ∢D.","הכניסו את ∢A ואת ∢C, או את ∢B / ∢D.");
    rows.push([LRI("∢B = ∢D"), R_KITE_BD()]);
    const s=360-v.A-v.C; if (!(s>0)) throw TW().sumBad(R(v.A+v.C));
    rows.push([LRI("∢B + ∢D = 360° − ∢A − ∢C = 360 − "+R(v.A)+" − "+R(v.C)+" = "+R(s)+"°"), R_QUAD()]);
    v.B=v.D=s/2; computed.push("B","D");
    rows.push([LRI("∢B = ∢D = "+R(s)+"° ÷ 2 = "+R(v.B)+"°"), g2("Two equal angles: divide by 2","שתי זוויות שוות: מחלקים ב-2")]);
  }
  rows.push([LRI("∢BAC = ∢DAC = ∢A ÷ 2 = "+R(v.A/2)+"°"), g2("The main diagonal bisects the vertex angles","האלכסון הראשי חוצה את זוויות הראש")]);
  rows.push([LRI("∢BCA = ∢DCA = ∢C ÷ 2 = "+R(v.C/2)+"°"), g2("The main diagonal bisects the vertex angles","האלכסון הראשי חוצה את זוויות הראש")]);
  return { rows, title:g2("Angles","הזוויות"), answer: [LRI("∢A = "+R(v.A)+"°   ∢C = "+R(v.C)+"°"), LRI("∢B = ∢D = "+R(v.B)+"°")].join("\n"), svg: kiteSVG(v, computed, {diag:true}) };
}

function kiteArea(v){
  lenPos(v,["d1","d2","S"]);
  const n=["d1","d2","S"].filter(k=>v[k]!=null).length;
  if (n<2) throw g2("Enter 2 of these 3: AC, BD, area.","הכניסו 2 מתוך 3: AC, BD, שטח.");
  const u=usuf, rows=[[kiteGiven(), GV()], [g2("AC is the main diagonal, BD is the other diagonal", LRI("AC")+" האלכסון הראשי, "+LRI("BD")+" האלכסון המשני"), GV()]];
  rows.push([LRI(["d1","d2","S"].filter(k=>v[k]!=null).map(k=>({d1:"AC",d2:"BD",S:"S"})[k]+" = "+R(v[k])).join(" ,  ")), GV()]);
  rows.push([LRI("AC ⊥ BD"), g2("In a kite, the main diagonal is perpendicular to the other diagonal","בדלתון האלכסון הראשי מאונך לאלכסון המשני")]);
  const RA = g2("Kite area = half the product of the diagonals","שטח דלתון = מחצית מכפלת האלכסונים");
  let {d1,d2,S}=v;
  if (d1!=null && d2!=null) {
    const s=d1*d2/2;
    if (S!=null && Math.abs(S-s)>1e-9) throw g2("These numbers don't fit: AC · BD ÷ 2 = "+R(s)+".","המספרים לא מתאימים: AC · BD ÷ 2 = "+R(s)+".");
    S=s; rows.push([LRI("S = AC · BD ÷ 2 = "+R(d1)+" · "+R(d2)+" ÷ 2 = "+R(S)+u(2)), RA]);
  } else if (d1!=null) { d2=2*S/d1; rows.push([LRI("AC · BD ÷ 2 = S  ⇒  BD = 2 · S ÷ AC = 2 · "+R(S)+" ÷ "+R(d1)+" = "+R(d2)+u(1)), RA]); }
  else { d1=2*S/d2; rows.push([LRI("AC · BD ÷ 2 = S  ⇒  AC = 2 · S ÷ BD = 2 · "+R(S)+" ÷ "+R(d2)+" = "+R(d1)+u(1)), RA]); }
  rows.push([LRI("BO = OD = BD ÷ 2 = "+R(d2)+" ÷ 2 = "+R(d2/2)+u(1)), g2("The main diagonal bisects the other diagonal","האלכסון הראשי חוצה את האלכסון המשני")]);
  return { rows, title:g2("Kite","דלתון"), answer: [LRI("S = "+R(S)+u(2)), LRI("AC = "+R(d1)+u(1)), LRI("BD = "+R(d2)+u(1))].join("\n"), svg: kiteSVG(null, [], {diag:true}) };
}

const ANG4 = k => [k, "∢"+k+" (°)", "∢"+k+" (°)"];

function kiteDiagSVG(x, computed){
  const P={A:[150,22],B:[58,96],C:[150,236],D:[242,96]};
  const dash = "stroke:var(--pen);stroke-width:1.5;stroke-dasharray:5 4";
  let s=`<svg viewBox="0 0 300 262" role="img" aria-label="ABCD"><polygon points="${P.A} ${P.B} ${P.C} ${P.D}" style="fill:var(--pen-soft);stroke:var(--pen);stroke-width:2.5;stroke-linejoin:round"/>`;
  s += tickMarks(P.A,P.B,1) + tickMarks(P.A,P.D,1) + tickMarks(P.C,P.B,2) + tickMarks(P.C,P.D,2);
  s += `<line x1="150" y1="22" x2="150" y2="236" style="${dash}"/><line x1="58" y1="96" x2="242" y2="96" style="${dash}"/>`;
  s += `<path d="M150,84 h12 v12" style="fill:none;stroke:var(--ink);stroke-width:1.2"/>` + svgText(140,112,"O",LBL.replace("15px","12px"));
  s += svgText(150,15,"A",LBL) + svgText(44,101,"B",LBL) + svgText(150,256,"C",LBL) + svgText(256,101,"D",LBL);
  const st = k => angStyle(computed.includes(k)).replace("13px","12px");
  const L = (px,py,k,anchor) => `<text x="${px}" y="${py}" text-anchor="${anchor}" style="${st(k)}">${x[k]!=null?R(x[k])+"°":"?"}</text>`;
  s += L(145,64,"BAC","end") + L(155,64,"BAC","start") + L(145,206,"BCA","end") + L(155,206,"BCA","start");
  s += L(78,90,"ABD","start") + L(78,113,"CBD","start") + L(222,90,"ABD","end") + L(222,113,"CBD","end");
  return s + "</svg>";
}
function kiteDiag(v){
  const keys=["A","B","C","BAC","BCA","ABD","CBD"];
  for (const k of keys) if (v[k]!=null && !(v[k]>0 && v[k]<180)) throw TW().range;
  for (const k of ["BAC","BCA","ABD","CBD"]) if (v[k]!=null && !(v[k]<90)) throw g2("∢"+k+" is an angle in a right triangle, so it must be less than 90°.","∢"+k+" היא זווית במשולש ישר זווית, ולכן היא חייבת להיות קטנה מ-90°.");
  const given = keys.filter(k=>v[k]!=null);
  if (!given.length) throw g2("Enter at least two angles.","הכניסו לפחות שתי זוויות.");
  const x = {...v};
  const rows = [[kiteGiven(), GV()],
    [g2("AC is the main diagonal, BD is the other diagonal, they meet at O", LRI("AC")+" אלכסון ראשי, "+LRI("BD")+" אלכסון משני, נפגשים בנקודה "+LRI("O")), GV()],
    [LRI(given.map(k=>"∢"+k+" = "+R(v[k])+"°").join(" ,  ")), GV()],
    [LRI("AC ⊥ BD   (∢AOB = ∢BOC = 90°)"), g2("In a kite, the main diagonal is perpendicular to the other diagonal","בדלתון האלכסון הראשי מאונך לאלכסון המשני")]];
  const BIS = g2("The main diagonal bisects the vertex angles","האלכסון הראשי חוצה את זוויות הראש");
  const TRI = t => g2("In the right triangle "+t+", the two acute angles add up to 90°", "במשולש ישר הזווית "+LRI(t)+" סכום הזוויות החדות 90°");
  const ADD = g2("Adding angles: ∢B = ∢ABD + ∢CBD","חיבור זוויות: "+LRI("∢B = ∢ABD + ∢CBD"));
  const QUAD = g2("The angles of a quadrilateral add up to 360°, and ∢B = ∢D","סכום הזוויות במרובע 360°, ו-"+LRI("∢B = ∢D"));
  const BAD = g2("These givens don't fit together. Check them.","הנתונים לא מתאימים זה לזה. בדקו אותם.");
  let changed;
  const set = (k, val, claim, why) => {
    if (x[k]==null) { if (!(val>0 && val<360)) throw BAD; x[k]=val; rows.push([LRI(claim), why]); changed=true; }
    else if (Math.abs(x[k]-val)>1e-9) throw BAD;
  };
  for (let n=0; n<20; n++) {
    changed=false;
    if (x.A!=null) set("BAC", x.A/2, "∢BAC = ∢DAC = ∢A ÷ 2 = "+R(x.A)+" ÷ 2 = "+R(x.A/2)+"°", BIS);
    if (x.BAC!=null) set("A", 2*x.BAC, "∢A = 2 · ∢BAC = 2 · "+R(x.BAC)+" = "+R(2*x.BAC)+"°", BIS);
    if (x.C!=null) set("BCA", x.C/2, "∢BCA = ∢DCA = ∢C ÷ 2 = "+R(x.C)+" ÷ 2 = "+R(x.C/2)+"°", BIS);
    if (x.BCA!=null) set("C", 2*x.BCA, "∢C = 2 · ∢BCA = 2 · "+R(x.BCA)+" = "+R(2*x.BCA)+"°", BIS);
    if (x.BAC!=null) set("ABD", 90-x.BAC, "∢ABD = 90° − ∢BAC = 90 − "+R(x.BAC)+" = "+R(90-x.BAC)+"°", TRI("AOB"));
    if (x.ABD!=null) set("BAC", 90-x.ABD, "∢BAC = 90° − ∢ABD = 90 − "+R(x.ABD)+" = "+R(90-x.ABD)+"°", TRI("AOB"));
    if (x.BCA!=null) set("CBD", 90-x.BCA, "∢CBD = 90° − ∢BCA = 90 − "+R(x.BCA)+" = "+R(90-x.BCA)+"°", TRI("BOC"));
    if (x.CBD!=null) set("BCA", 90-x.CBD, "∢BCA = 90° − ∢CBD = 90 − "+R(x.CBD)+" = "+R(90-x.CBD)+"°", TRI("BOC"));
    if (x.ABD!=null && x.CBD!=null) set("B", x.ABD+x.CBD, "∢B = ∢ABD + ∢CBD = "+R(x.ABD)+" + "+R(x.CBD)+" = "+R(x.ABD+x.CBD)+"°", ADD);
    if (x.B!=null && x.ABD!=null) set("CBD", x.B-x.ABD, "∢CBD = ∢B − ∢ABD = "+R(x.B)+" − "+R(x.ABD)+" = "+R(x.B-x.ABD)+"°", ADD);
    if (x.B!=null && x.CBD!=null) set("ABD", x.B-x.CBD, "∢ABD = ∢B − ∢CBD = "+R(x.B)+" − "+R(x.CBD)+" = "+R(x.B-x.CBD)+"°", ADD);
    if (x.A!=null && x.C!=null) set("B", (360-x.A-x.C)/2, "∢B = ∢D = (360° − ∢A − ∢C) ÷ 2 = (360 − "+R(x.A)+" − "+R(x.C)+") ÷ 2 = "+R((360-x.A-x.C)/2)+"°", QUAD);

const DEGR = Math.PI / 180;

const R_PYTH = () => g2("Pythagoras: hypotenuse² = leg² + leg²", "משפט פיתגורס: יתר² = ניצב² + ניצב²");
const R_SIN = () => g2("Right triangle: sin = opposite leg ÷ hypotenuse", "במשולש ישר-זווית: sin = הניצב שמול הזווית ÷ היתר");
const R_COS = () => g2("Right triangle: cos = adjacent leg ÷ hypotenuse", "במשולש ישר-זווית: cos = הניצב שליד הזווית ÷ היתר");
const R_TAN = () => g2("Right triangle: tan = opposite leg ÷ adjacent leg", "במשולש ישר-זווית: tan = הניצב שמול הזווית ÷ הניצב שליד הזווית");
const R_ACUTE = () => g2("In a right triangle the two acute angles add up to 90°", "במשולש ישר-זווית סכום הזוויות החדות 90°");
const R_LOC = () => g2("Law of cosines: c² = a² + b² − 2ab·cos C", "משפט הקוסינוסים: " + LRI("c² = a² + b² − 2ab·cos C"));
const R_LOS = () => g2("Law of sines: a ÷ sin A = b ÷ sin B = c ÷ sin C = 2R", "משפט הסינוסים: " + LRI("a ÷ sin A = b ÷ sin B = c ÷ sin C = 2R"));

function triSVG(S, An, computed){
  const a = S.a, b = S.b, c = S.c;
  let pB = [0, 0], pC = [a, 0], pA = [c * cosD(An.B), c * sinD(An.B)];
  const xs = [pA[0], pB[0], pC[0]], ys = [pA[1], pB[1], pC[1]];
  const minX = Math.min(...xs), maxX = Math.max(...xs), maxY = Math.max(...ys);
  const k = Math.min(220 / (maxX - minX || 1), 120 / (maxY || 1));
  const T = p => [30 + (p[0] - minX) * k + (220 - (maxX - minX) * k) / 2, 145 - p[1] * k];
  const P = { A: T(pA), B: T(pB), C: T(pC) }, cen = [(P.A[0] + P.B[0] + P.C[0]) / 3, (P.A[1] + P.B[1] + P.C[1]) / 3];

  let s = `<svg viewBox="0 0 280 170" role="img" aria-label="ABC"><polygon points="${P.A.map(f)} ${P.B.map(f)} ${P.C.map(f)}" style="fill:var(--pen-soft);stroke:var(--pen);stroke-width:2.5;stroke-linejoin:round"/>`;
  for (const V of ["A", "B", "C"]) {
    const d = [P[V][0] - cen[0], P[V][1] - cen[1]], L = Math.hypot(...d) || 1;
    s += svgText(f(P[V][0] + d[0] / L * 13), f(P[V][1] + d[1] / L * 13 + 5), V, LBL);
    if (Math.abs(An[V] - 90) < 1e-6) {
      const o = { A: ["B", "C"], B: ["A", "C"], C: ["A", "B"] }[V], u = o.map(W => { const dx = P[W][0] - P[V][0], dy = P[W][1] - P[V][1], l = Math.hypot(dx, dy); return [dx / l * 10, dy / l * 10]; });
      s += `<path d="M${f(P[V][0] + u[0][0])},${f(P[V][1] + u[0][1])} l${f(u[1][0])},${f(u[1][1])} l${f(-u[0][0])},${f(-u[0][1])}" style="fill:none;stroke:var(--ink);stroke-width:1.2"/>`;
    } else s += svgText(f(P[V][0] + (cen[0] - P[V][0]) * 0.32), f(P[V][1] + (cen[1] - P[V][1]) * 0.32 + 5), R(Math.round(An[V] * 10) / 10) + "°", angStyle(computed.includes(V)));
  }
  for (const [side, [U, W]] of [["a", ["B", "C"]], ["b", ["A", "C"]], ["c", ["A", "B"]]]) {
    const m = [(P[U][0] + P[W][0]) / 2, (P[U][1] + P[W][1]) / 2], d = [m[0] - cen[0], m[1] - cen[1]], L = Math.hypot(...d) || 1;
    s += svgText(f(m[0] + d[0] / L * 14), f(m[1] + d[1] / L * 14 + 5), R(Math.round(S[side] * 100) / 100), angStyle(computed.includes(side)));
  }
  return s + "</svg>";
}

function triSolve(v){

  const known = () => ["a", "b", "c"].filter(k => S[k] != null).length + ["A", "B", "C"].filter(k => An[k] != null).length;
  if (known() < 3 || !["a", "b", "c"].some(k => S[k] != null)) throw g2("Enter 3 givens, at least one of them a side.", "הכניסו 3 נתונים, ולפחות אחד מהם צלע.");
  const rows = [[g2("Triangle ABC:  a = BC ,  b = AC ,  c = AB", "משולש " + LRI("ABC") + ":  " + LRI("a = BC ,  b = AC ,  c = AB")), GV()]];
  rows.push([LRI([...["a", "b", "c"].filter(k => S[k] != null).map(k => TRI_SIDE[k] + " = " + R(S[k])), ...["A", "B", "C"].filter(k => An[k] != null).map(k => "∢" + k + " = " + R(An[k]) + "°")].join(" ,  ")), GV()]);
  const computed = [];
  const setA = (k, x, claim, why) => { if (!(x > 0 && x < 180)) throw g2("These givens don't make a triangle.", "הנתונים האלה לא יוצרים משולש."); An[k] = x; computed.push(k); rows.push([LRI(claim), why]); };
  const setS = (k, x, claim, why) => { if (!(x > 0) || !isFinite(x)) throw g2("These givens don't make a triangle.", "הנתונים האלה לא יוצרים משולש."); S[k] = x; computed.push(k); rows.push([LRI(claim), why]); };

        if (m === h) { const x = Math.hypot(S[legs[0]], S[legs[1]]); setS(m, x, TRI_SIDE[h] + "² = " + TRI_SIDE[legs[0]] + "² + " + TRI_SIDE[legs[1]] + "² = " + R(S[legs[0]]) + "² + " + R(S[legs[1]]) + "² = " + R(S[legs[0]] ** 2 + S[legs[1]] ** 2) + "  ⇒  " + TRI_SIDE[h] + AE(x) + u(1), R_PYTH()); }
        else { const o = legs.find(k => k !== m), x = Math.sqrt(S[h] ** 2 - S[o] ** 2); setS(m, x, TRI_SIDE[m] + "² = " + TRI_SIDE[h] + "² − " + TRI_SIDE[o] + "² = " + R(S[h]) + "² − " + R(S[o]) + "² = " + R(S[h] ** 2 - S[o] ** 2) + "  ⇒  " + TRI_SIDE[m] + AE(x) + u(1), R_PYTH()); }

        const x = asinD(S[o] / S[h]);
        setA(Y, x, "sin " + Y + " = " + TRI_SIDE[o] + " ÷ " + TRI_SIDE[h] + " = " + R(S[o]) + " ÷ " + R(S[h]) + AE(S[o] / S[h]) + "  ⇒  ∢" + Y + AE(x) + "°", R_SIN());
        sumAngles(); continue;
      }
      if (nS.length === 1 && X) {
        const k = nS[0], o = oppOf(X), a_ = adjOf(X);
        const SX = "∢" + X;
        if (k === h) {
          setS(o, S[h] * sinD(An[X]), "sin " + SX.slice(1) + " = " + TRI_SIDE[o] + " ÷ " + TRI_SIDE[h] + "  ⇒  " + TRI_SIDE[o] + " = " + R(S[h]) + " · sin " + R(An[X]) + "°" + AE(S[h] * sinD(An[X])) + u(1), R_SIN());
          setS(a_, S[h] * cosD(An[X]), "cos " + X + " = " + TRI_SIDE[a_] + " ÷ " + TRI_SIDE[h] + "  ⇒  " + TRI_SIDE[a_] + " = " + R(S[h]) + " · cos " + R(An[X]) + "°" + AE(S[h] * cosD(An[X])) + u(1), R_COS());
        } else if (k === o) {
          setS(h, S[o] / sinD(An[X]), "sin " + X + " = " + TRI_SIDE[o] + " ÷ " + TRI_SIDE[h] + "  ⇒  " + TRI_SIDE[h] + " = " + R(S[o]) + " ÷ sin " + R(An[X]) + "°" + AE(S[o] / sinD(An[X])) + u(1), R_SIN());
          setS(a_, S[o] / tanD(An[X]), "tan " + X + " = " + TRI_SIDE[o] + " ÷ " + TRI_SIDE[a_] + "  ⇒  " + TRI_SIDE[a_] + " = " + R(S[o]) + " ÷ tan " + R(An[X]) + "°" + AE(S[o] / tanD(An[X])) + u(1), R_TAN());
        } else {
          setS(o, S[a_] * tanD(An[X]), "tan " + X + " = " + TRI_SIDE[o] + " ÷ " + TRI_SIDE[a_] + "  ⇒  " + TRI_SIDE[o] + " = " + R(S[a_]) + " · tan " + R(An[X]) + "°" + AE(S[a_] * tanD(An[X])) + u(1), R_TAN());
          setS(h, S[a_] / cosD(An[X]), "cos " + X + " = " + TRI_SIDE[a_] + " ÷ " + TRI_SIDE[h] + "  ⇒  " + TRI_SIDE[h] + " = " + R(S[a_]) + " ÷ cos " + R(An[X]) + "°" + AE(S[a_] / cosD(An[X])) + u(1), R_COS());

      if (nS.length === 3 && angs().length < 3) {

        if (x + y <= z || x + z <= y || y + z <= x) throw T("triIneq");

          setS(m, x, TRI_SIDE[m] + "² = " + R(S[p]) + "² + " + R(S[q]) + "² − 2 · " + R(S[p]) + " · " + R(S[q]) + " · cos " + R(An[M]) + "°" + AE(x2) + "  ⇒  " + TRI_SIDE[m] + AE(x) + u(1), R_LOC());

      const pair = ["a", "b", "c"].find(k => S[k] != null && An[TRI_OPP[k]] != null);
      if (!pair) break;
      const ratio = S[pair] / sinD(An[TRI_OPP[pair]]);
      const sideTodo = ["a", "b", "c"].find(k => S[k] == null && An[TRI_OPP[k]] != null);
      if (sideTodo) { const x = ratio * sinD(An[TRI_OPP[sideTodo]]); setS(sideTodo, x, TRI_SIDE[sideTodo] + " ÷ sin " + TRI_OPP[sideTodo] + " = " + TRI_SIDE[pair] + " ÷ sin " + TRI_OPP[pair] + "  ⇒  " + TRI_SIDE[sideTodo] + " = " + R(S[pair]) + " · sin " + R(An[TRI_OPP[sideTodo]]) + "° ÷ sin " + R(An[TRI_OPP[pair]]) + "°" + AE(x) + u(1), R_LOS()); continue; }
      const angTodo = ["a", "b", "c"].find(k => S[k] != null && An[TRI_OPP[k]] == null);
      if (angTodo) {

  if (second) rows.push([LRI("∢" + second.Y + " = 180° − " + R(An[second.Y]) + "° = " + R(second.alt) + "°"), g2("sin is positive for an acute and an obtuse angle: this second triangle also fits", "sin חיובי גם לזווית חדה וגם לזווית קהה: גם המשולש השני הזה מתאים")]);

  rows.push([LRI("P = " + R(S.a) + " + " + R(S.b) + " + " + R(S.c) + AE(per) + u(1)), g2("Perimeter = sum of the sides", "היקף = סכום הצלעות")]);

}

function circSVG(al){

// ---------- the question: what to find ----------
function askTargets(){
  const extra = ($("geoText").value.match(/(?:מצא|חשב|הוכח|find|calculate|what is|מהו|מהי|כמה)[^\n]*/gi) || []).join(" ");
  const t = " " + $("geoAsk").value + " " + extra + " ";
  if (!t.trim()) return [];
  const out = [];
  const ANGW = /(?:∢|∠|(?:ה|את\s+)?זווית\s*|angle\s*)([A-DOa-do]{1,3})(?![A-Za-z])/gi;
  for (const m of t.matchAll(ANGW)) out.push("∢" + m[1].toUpperCase());
  for (const m of t.replace(ANGW, " ").matchAll(/(?<![A-Za-z∢])([A-DOa-do]{2})(?![A-Za-z])/g)) out.push(m[1].toUpperCase());
  if (/שטח|area/i.test(t)) out.push("S");
  if (/היקף|perimeter/i.test(t)) out.push("P");
  if (/קשת|arc/i.test(t)) out.push("L");
  if (/רדיוס|radius/i.test(t)) out.push("R");
  if (/גובה|height/i.test(t)) out.push("AD");
  if (/מיתר|chord/i.test(t)) out.push("AB");
  if (/יחס|ratio/i.test(t)) out.push("k");
  return [...new Set(out)];
}
function askBox(r, targets){
  const texts = [...plain(r.answer).split("\n"), ...r.rows.slice().reverse().map(x => plain(x[0]))].map(x => x.replace(/\s+/g, " "));
  const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const box = el("div", "askbox"); box.append(el("small", null, T("askAns")));
  const miss = [];
  for (const tg of targets) {
    const names = /^[A-D]{2}$/.test(tg) ? [tg, tg[1] + tg[0]] : [tg];
    let hit = null;
    for (const x of texts) {
      for (const nm of names) {
        const m = x.match(new RegExp("(?:^|[\\s,(⇒])" + esc(nm) + "(?![A-Za-z²³])\\s*([=≈][^,⇒;]*)"));
        if (!m) continue;
        const parts = m[1].split(/(?=[=≈])/).map(p => p.trim()).filter(p => /^[=≈]\s*[−-]?\d/.test(p));
        if (parts.length) { hit = nm + " " + parts[parts.length - 1]; break; }
      }
      if (hit) break;
    }
    if (hit) box.append(dirOf(el("div", null, LRI(hit)), "")); else miss.push(tg);
  }
  if (miss.length) box.append(dirOf(el("p", null, T("askMiss", LRI(miss.join(", ")))), T("askMiss", "")));
  return box.childElementCount > 1 ? box : null;
}

function givensFromWords(raw){
  let t = " " + String(raw).replace(/\n/g, " , ") + " ";
  const shape = /דלתון|\bkite/i.test(t) ? "kite" : /טרפז|trapez/i.test(t) ? "trap" : /שווה[\s-]*שוקיים|isosceles/i.test(t) ? "iso"
    : /ישר[\s-]*זווית|right[\s-]*(?:angled\s+)?triangle|\bright\b|יתר|hypotenuse/i.test(t) ? "right" : /מעגל|circle|רדיוס|radius|מרכזית|central/i.test(t) ? "circle"
    : /דומים|similar/i.test(t) ? "sim" : /משולש|triangle/i.test(t) ? "tri" : null;
  const ask = /האם|\bis\s+(it|abcd|abc)\b/i.test(t);
  const NUM = "(\\d+(?:\\.\\d+)?)";
  const IS = "\\s*(?:=|:|שוו(?:ה|ים|ות)?\\s*(?:ל-?\\s*)?|הוא|היא|is|equals?)?\\s*";
  t = t.replace(/שוו(?:ה|י)[\s-]*(?:שוקיים|צלעות)|isosceles|equilateral/gi, " ");
  t = t.replace(/ישר[\s-]*זווית|right[\s-]*(?:angled\s+)?(?=triangle)/gi, " ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?רדיוס" + IS + NUM, "g"), " r = $1 ").replace(new RegExp("\\bradius" + IS + NUM, "gi"), " r = $1 ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?זווית\\s+(?:ה)?מרכזית" + IS + NUM, "g"), " α = $1 ").replace(new RegExp("central\\s+angle" + IS + NUM, "gi"), " α = $1 ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?יתר" + IS + NUM, "g"), " AB = $1 ").replace(new RegExp("\\bhypotenuse" + IS + NUM, "gi"), " AB = $1 ");
  // iso / kite words with a number
  t = t.replace(new RegExp("(?:ו|ה|וה)?זווית\\s+ה?ראש" + IS + NUM, "g"), " ∢A = $1 ").replace(new RegExp("vertex\\s+angle" + IS + NUM, "gi"), " ∢A = $1 ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?זווי(?:ת|ות)\\s+ה?בסיס" + IS + NUM, "g"), " ∢B = $1 ").replace(new RegExp("base\\s+angles?" + IS + NUM, "gi"), " ∢B = $1 ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?אלכסון\\s+ה?ראשי(?:\\s+[A-Da-d]{2})?" + IS + NUM, "g"), " AC = $1 ").replace(new RegExp("main\\s+diagonal(?:\\s+[A-Da-d]{2})?" + IS + NUM, "gi"), " AC = $1 ");
  t = t.replace(new RegExp("(?:ו|ה|וה)?אלכסון\\s+ה?משני(?:\\s+[A-Da-d]{2})?" + IS + NUM, "g"), " BD = $1 ").replace(new RegExp("(?:other|secondary)\\s+diagonal(?:\\s+[A-Da-d]{2})?" + IS + NUM, "gi"), " BD = $1 ");
  if (shape === "iso" || !shape) {
    t = t.replace(new RegExp("(?:ו|ה|וה)?שוק(?:יים|ים)?" + IS + NUM, "g"), " AB = AC = $1 ").replace(new RegExp("\\blegs?" + IS + NUM, "gi"), " AB = AC = $1 ");
    t = t.replace(new RegExp("(?:ו|ה|וה)?בסיס" + IS + NUM, "g"), " BC = $1 ").replace(new RegExp("\\bbase" + IS + NUM, "gi"), " BC = $1 ");
  }
  t = t.replace(new RegExp("(?:ו|ה|וה)?שטח(?:ו|ה|ם)?(?:\\s+ה?[\\u0590-\\u05FF]+)?" + IS + NUM, "g"), " S = $1 ").replace(new RegExp("\\barea(?:\\s+of\\s+\\w+)?" + IS + NUM, "gi"), " S = $1 ");
  // general words
  t = t.replace(/(?:ו)?(?:לא\s+|אינו\s+|אינה\s+)מקביל\S*\s*(?:ל-?\s*)?/g, " ∦ ");
  t = t.replace(/(?:ו)?מקביל(?:ה|ים|ות)?\s*(?:ל-?\s*)?/g, " ∥ ").replace(/\bparallel(?:\s+to)?\b/gi, " ∥ ");
  t = t.replace(/(?:ו|ה|וה)?זווי(?:ת|ות)\s*/g, " ∢").replace(/\bangles?\s*/gi, " ∢");
  t = t.replace(/מעלות|מעלה|\bdegrees?\b/gi, "°");
  t = t.replace(/שוו(?:ה|ים|ות)?\s*(?:ל-?\s*)?/g, " = ").replace(/\s(?:הוא|היא|הם|הן)\s/g, " = ").replace(/\b(?:is|equals?)\b/gi, " = ");
  t = t.replace(/\b(?:the|to|of|and|triangle|trapezoid|kite|quadrilateral|find|is)\b/gi, " ");
  t = t.replace(/(?<![a-zA-Z])[a-do]{1,3}(?![a-zA-Z])/g, m => m.toUpperCase());
  t = t.replace(/[֐-׿"'״׳]+/g, " ");
  // "∢A 110" or "AB 13" without "=": add it
  t = t.replace(/(∢\s*[A-DO]{1,3}|(?<![A-Z])[A-D]{2}(?![A-Z])|(?<![A-Z])S(?![A-Z]))\s+(?=\d)/g, "$1 = ");
  return { t, shape, ask };
}
function parseGivens(raw){

// ---------- reading numbers written on the drawing itself ----------
// The scanner gives every word with its position. Vertex letters (A–D, O) are found, and each number
// is matched to the nearest vertex (an angle) or the nearest side (a length).
function diagramGivens(items){
  const inText = it => /=|∥|\|\||\/\//.test(it.line || "") || (it.line || "").trim().split(/\s+/).length > 3;
  const V = {};
  for (const it of items) {
    const m = String(it.t).trim().match(/^([A-DO])$/);
    if (!m || inText(it)) continue;
    if (!V[m[1]]) V[m[1]] = it;
  }
  const verts = ["A","B","C","D"].filter(k => V[k]);
  if (verts.length < 3) return [];
  const pt = k => [V[k].x, V[k].y];
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const ring = verts;                      // A, B, C, (D) in drawing order
  const sides = ring.map((k, i) => [k, ring[(i+1) % ring.length]]);
  const scale = sides.reduce((t, [a,b]) => t + dist(pt(a), pt(b)), 0) / sides.length;
  const segDist = (p, a, b) => { const [ax,ay]=a,[bx,by]=b, dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
    let u = L ? ((p[0]-ax)*dx + (p[1]-ay)*dy) / L : 0; const inside = u > 0.15 && u < 0.85; u = Math.max(0, Math.min(1, u));
    return { d: Math.hypot(p[0]-(ax+u*dx), p[1]-(ay+u*dy)), inside }; };
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const angles = {}, lens = {};
  for (const it of items) {
    if (inText(it)) continue;
    const m = String(it.t).trim().match(/^(\d+(?:\.\d+)?)([°oº˚]?)$/);
    if (!m) continue;
    let v = parseFloat(m[1]); let deg = !!m[2];
    if (!deg && v >= 180 && /0$/.test(m[1]) && v/10 < 180) { v = v/10; deg = true; }
    const p = [it.x, it.y];
    let best = null;
    for (const k of verts) { const d = dist(p, pt(k)); if (!best || d < best.d) best = { k, d }; }
    let bestSide = null;
    for (const [a,b] of sides) { const r = segDist(p, pt(a), pt(b)); if (r.inside && (!bestSide || r.d < bestSide.d)) bestSide = { a, b, d: r.d }; }
    const asAngle = deg ? best.d < 0.7*scale : (best.d < 0.4*scale && (!bestSide || best.d < bestSide.d*1.2));
    if (asAngle && v < 360) {
      let name = best.k;
      if (V.O && ring.length === 4) {          // a diagonal splits this angle: find which part the number sits in
        const i = ring.indexOf(best.k), n1 = ring[(i+3)%4], n2 = ring[(i+1)%4], w = ring[(i+2)%4];
        const s0 = cross(pt(best.k), pt("O" in V ? "O" : w), p), s1 = cross(pt(best.k), pt("O"), pt(n1));
        const near = Math.sign(s0) === Math.sign(s1) ? n1 : n2;
        name = near + best.k + w;
      }
      if (!angles[name] || best.d < angles[name].d) angles[name] = { v, d: best.d };
    } else if (bestSide && bestSide.d < 0.35*scale) {
      const nm = bestSide.a + bestSide.b;
      if (!lens[nm] || bestSide.d < lens[nm].d) lens[nm] = { v, d: bestSide.d };
    }
  }
  return [...Object.entries(angles).map(([k,o]) => "∢"+k+" = "+R(o.v)+"°"),
          ...Object.entries(lens).map(([k,o]) => k+" = "+R(o.v))];
}

  const head = el("div", "sheethead"); const h = el("h2", null, T("custom")); h.id = "customTitle";
  const x = el("button", "iconbtn"); x.type = "button"; x.setAttribute("aria-label", T("done"));
  x.append(svgEl('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>')); x.onclick = closeCustomize;
  head.append(h, x); box.append(head);
  // live preview
  const pv = el("section", "panel preview"); pv.append(el("p", "exlabel", T("previewH")));
  const a = el("div", "ans"); a.append(el("small", null, T("answer"))); const v = el("div", null, "x = 6"); v.dir = "ltr"; a.append(v);
  const r2 = el("div", "row2"); const pb = el("button", "btn", T("previewBtn")); pb.type = "button"; pb.style.flex = "1";
  r2.append(chip("2x + 5 = 17", "math", () => {}, true), chip("360", "math", () => {}, false));
  pv.append(a, r2, pb); box.append(pv);
  const panel = el("section", "panel");
  const opt = (title, content) => { const o = el("div", "opt"); o.append(el("h3", null, title), content); panel.append(o); };
  const chips = (pairs, key) => { const c = el("div", "chips wrapchips"); for (const [val, label] of pairs) c.append(chip(label, "", () => setUI(key, val), ui[key] === val)); return c; };
  opt(T("themeH"), chips([["system", T("themeSystem")], ["light", T("themeLight")], ["dark", T("themeDark")]], "theme"));
  const sw = el("div", "swatches");
  for (const [k, c] of Object.entries(ACCENTS)) { const b = el("button", "sw"); b.type = "button"; b.style.background = isDark() ? c[3] : c[0]; b.setAttribute("aria-label", k); b.setAttribute("aria-pressed", String(ui.accent === k)); b.onclick = () => setUI("accent", k); sw.append(b); }
  opt(T("accentH"), sw);
  const mk = el("div", "swatches");
  for (const [k, c] of Object.entries(MARKS)) { const b = el("button", "sw"); b.type = "button"; b.style.background = isDark() ? c[1] : c[0]; b.setAttribute("aria-label", k); b.setAttribute("aria-pressed", String(ui.mark === k)); b.onclick = () => setUI("mark", k); mk.append(b); }
  opt(T("markH"), mk);
  const bgs = el("div", "swatches");
  for (const [k, key] of [["grid","bgGrid"],["dots","bgDots"],["lines","bgLines"],["plain","bgPlain"]]) {
    const b = el("button", "bgtile"); b.type = "button"; b.setAttribute("aria-pressed", String(ui.bg === k)); b.append(el("i", k), el("span", null, T(key))); b.onclick = () => setUI("bg", k); bgs.append(b);
  }
  opt(T("bgH"), bgs);
  const sz = el("div", "chips wrapchips");
  for (const [k, label, px] of [["s","A",13],["m","A",16],["l","A",19],["xl","A",22]]) { const c = chip(label, "", () => setUI("size", k), ui.size === k); c.style.fontSize = px + "px"; c.style.minWidth = "48px"; sz.append(c); }
  opt(T("sizeH"), sz);
  opt(T("fontH"), chips([["rubik", T("fontRubik")], ["system", T("fontSystem")]], "font"));
  const lg = el("div", "chips wrapchips");
  lg.append(chip("English", "", () => { setLang("en"); renderCustomize(); }, lang === "en"), chip("עברית", "", () => { setLang("he"); renderCustomize(); }, lang === "he"));
  opt(T("langH"), lg);
  box.append(panel);
  const done = el("button", "btn", T("done")); done.type = "button"; done.onclick = closeCustomize;
  const rs = el("button", "btn quiet", T("reset")); rs.type = "button"; rs.onclick = () => { ui = {...UI_DEFAULT}; try { localStorage.removeItem("ui"); } catch(e) {} applyUI(); renderCustomize(); };
  box.append(done, rs);
}

// ---------- welcome: the first screen after installing ----------
function seenWelcome(){ try { return localStorage.getItem("welcomed") === "1"; } catch(e) { return true; } }
function hideWelcome(){ try { localStorage.setItem("welcomed", "1"); } catch(e) {} $("welcome").hidden = true; }
function showWelcome(){ renderWelcome(); $("welcome").hidden = false; }
function renderWelcome(){
  const box = $("welcomeInner"); box.innerHTML = "";
  const lg = el("div", "lang"); lg.setAttribute("role", "group");
  for (const [k, label] of [["en","EN"],["he","עב"]]) { const b = el("button", null, label); b.type = "button"; b.setAttribute("aria-pressed", String(lang === k)); b.onclick = () => { setLang(k); renderWelcome(); }; lg.append(b); }
  const hero = el("div", "hero");
  hero.append(svgEl('<span class="logo" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V6a2 2 0 0 1 2-2h3M19 4h3a2 2 0 0 1 2 2v3M24 19v3a2 2 0 0 1-2 2h-3M9 24H6a2 2 0 0 1-2-2v-3"/><path d="M10 12h8M10 16h8"/><circle cx="20.5" cy="20.5" r="0.1" stroke="#FFE27A" stroke-width="3.2"/></svg></span>'));
  for (const [cls, txt] of [["f1","2x + 5 = 17"],["f2","3/4 + 2/3"],["f3","∢A = 110°"]]) hero.append(el("span", "float " + cls, txt));
  const f4 = el("span", "float f4"); f4.append(el("span", null, "x = 6")); hero.append(f4);
  const h = el("h2", null, T("welcomeTitle")); h.id = "welcomeTitle";
  const acts = el("div", "acts");
  if (ACC) { const g = el("button", "btn google"); g.type = "button"; g.append(svgEl(ICON.google), el("span", null, T("google"))); g.onclick = () => { try { Android.signInGoogle(); } catch(e) {} }; acts.append(g); }
  const si = el("button", "btn"); si.type = "button"; si.textContent = T("wSignIn"); si.onclick = () => { hideWelcome(); authMode = "in"; tab("me"); setTimeout(() => $("accEmail") && $("accEmail").focus(), 80); };
  const su = el("button", "btn quiet"); su.type = "button"; su.textContent = T("wSignUp"); su.onclick = () => { hideWelcome(); authMode = "up"; tab("me"); setTimeout(() => $("accName") && $("accName").focus(), 80); };
  acts.append(si, su);
  const skip = el("button", "skip", T("wSkip")); skip.type = "button"; skip.onclick = () => { hideWelcome(); tab("solve"); };
  box.append(lg, hero, h, el("p", "lead", T("welcomeLead")), acts, skip);
}

// start
applyUI();
setLang(lang);
solveNow(true);
if (ACC) { try { const st = JSON.parse(Android.authState()); account = st.signedIn ? st : null; } catch(e) {} try { Android.ready(); } catch(e) {} }
if (ACC && !account && !seenWelcome()) showWelcome();
</script>
