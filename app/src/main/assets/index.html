<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Snap</title>
<style>
:root{
  --paper:#f7f9fc; --grid:#e3e9f3; --ink:#1a2233; --muted:#5d6b82;
  --pen:#2346d6; --on-pen:#ffffff; --pen-soft:#e6ebff; --card:#ffffff; --line:#cfd8e6;
  --ok:#0f7a4a; --ok-soft:#e3f5ec; --warn:#a33a1c; --warn-soft:#fdebe5;
  --sans:Roboto,"Noto Sans Hebrew",system-ui,sans-serif; --mono:ui-monospace,"Roboto Mono","Droid Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11151d; --grid:#1a202c; --ink:#e7ecf5; --muted:#97a3b8;
  --pen:#8da2ff; --on-pen:#0b0f1a; --pen-soft:#20284a; --card:#171c26; --line:#2b3446;
  --ok:#5fd39b; --ok-soft:#14302a; --warn:#ff9a7a; --warn-soft:#3a1d16; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-start;gap:12px}
header > div{flex:1;min-width:0}
h1{margin:0;font-size:32px;line-height:1;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--pen)}
.sub{margin:6px 0 0;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;color:var(--muted);font:700 14px/1 var(--sans);padding:9px 11px}
.lang button[aria-pressed="true"]{background:var(--pen);color:var(--on-pen)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.tabs button{border:0;background:none;color:var(--muted);font:600 16px/1 var(--sans);padding:12px;border-radius:7px}
.tabs button[aria-selected="true"]{background:var(--pen);color:var(--on-pen)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:16px 12px;font:700 16px/1 var(--sans);background:var(--pen);color:var(--on-pen);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--pen-soft);color:var(--pen)}
.btn svg{width:22px;height:22px;flex:none}
.lbl{font:700 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .lbl{letter-spacing:0}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:17px/1.5 var(--mono);padding:12px}
textarea{min-height:96px;resize:vertical}
select{font-family:var(--sans)}
.status{color:var(--muted);font-style:italic;margin:0}
.status.bad{color:var(--warn);font-style:normal}
.result{display:flex;flex-direction:column;gap:10px}
.prob{font:600 15px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ans{background:var(--ok-soft);border:1px solid var(--ok);border-radius:10px;padding:12px 14px}
.ans small{display:block;font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-bottom:6px}
.ans div{font:700 20px/1.4 var(--mono);overflow-wrap:anywhere}
.err{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:12px 14px}
.steps{margin:0;padding:0;list-style:none;font:15px/1.6 var(--mono);display:flex;flex-direction:column;gap:6px}
.steps li{overflow-wrap:anywhere;white-space:pre-wrap}
[dir="rtl"] [dir="ltr"]{text-align:right}
.ex{font-size:13px;color:var(--muted);margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0}
.notes{background:var(--pen-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--pen)}
.notes summary{font-weight:700;color:var(--pen);cursor:pointer}
.notes table{border-collapse:collapse;margin-top:8px;width:100%}
.notes td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.notes td.f{font-family:var(--mono);white-space:nowrap}
.fig svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.proofwrap{overflow-x:auto}
table.proof{width:100%;border-collapse:collapse;font-size:14px;line-height:1.5}
.proof th{background:var(--pen);color:var(--on-pen);padding:8px;font-weight:700;text-align:start}
.proof td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.proof td.claim{font-family:var(--mono)}
.proof td.claim.he{font-family:var(--sans)}
.ans div{white-space:pre-line}
.ans div[dir="rtl"]{font-family:var(--sans)}
.proof td.n{color:var(--muted);width:1.6em;text-align:center}
hr{border:0;border-top:1px dashed var(--line);width:100%;margin:4px 0}
button:focus-visible,textarea:focus,input:focus,select:focus{outline:2px solid var(--pen);outline-offset:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Math <span>Snap</span></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn" lang="en">EN</button>
      <button type="button" id="langHe" lang="he">עב</button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabSolve" aria-selected="true" data-t="tabSolve"></button>
    <button role="tab" id="tabGeo" aria-selected="false" data-t="tabGeo"></button>
  </div>

  <!-- SOLVE -->
  <section id="solvePanel" class="panel">
    <div class="row">
      <button class="btn" id="camera" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span data-t="camera"></span></button>
      <button class="btn alt" id="gallery" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg>
        <span data-t="gallery"></span></button>
    </div>
    <p class="status" id="ocrStatus" hidden></p>
    <label class="lbl" for="problem" data-t="problemLbl"></label>
    <textarea id="problem" dir="ltr" spellcheck="false" autocapitalize="off" autocomplete="off">3/4 + 2/3
2x + 5 = 17</textarea>
    <p class="ex"><span data-t="examples"></span> <span dir="ltr">2³ · 2⁵ · (x²)³ : x⁴ · 360 · (x + 2)(x − 3) · (x+2)(x+3) = x² + 10 · 3/4 + 2/3 · 2x + 5 = 17</span></p>
    <details class="notes" id="formulas"><summary data-t="formulas"></summary><div id="formulaBody"></div></details>
    <button class="btn" id="solve" type="button" data-t="solve"></button>
  </section>

  <section id="results" class="panel" aria-live="polite"></section>

  <!-- GEOMETRY -->
  <section id="geoPanel" class="panel" hidden>
    <label class="lbl" for="shape" data-t="shape"></label>
    <select id="shape"></select>
    <div class="notes" id="geoNotes" hidden></div>
    <div class="fields" id="geoFields"></div>
    <div id="unitRow" style="display:flex;flex-direction:column;gap:12px">
      <label class="lbl" for="unit" data-t="units"></label>
      <select id="unit"></select>
    </div>
    <button class="btn" id="calc" type="button" data-t="calc"></button>
  </section>
  <section id="geoResults" class="panel" hidden aria-live="polite"></section>
</div>

<script src="math.js"></script>
<script src="solver.js"></script>
<script>
const $ = id => document.getElementById(id);
const hasBridge = typeof window.Android !== "undefined";
const HEB = /[֐-׿]/;
const FSI = s => "⁨" + s + "⁩", LRI = s => "⁦" + s + "⁩";

// ---------- words ----------
const UI = {
  en: {
    sub:"Snap a math problem or type it. Works offline.", tabSolve:"Solve", tabGeo:"Geometry",
    camera:"Take photo", gallery:"Gallery", problemLbl:"Problem (one per line, fix anything misread)",
    examples:"Examples:", solve:"Solve it", formulas:"Formulas: power laws & extended distributive law", answer:"Answer", shape:"Shape", units:"Units", calc:"Calculate", noUnits:"no units",
    reading:"Reading the photo…", noMath:"I couldn't find any math in that photo. Try again closer, with good light, or type it.",
    checkText:"Check the text below and fix anything that was misread. Then tap Solve it.",
    appOnly:"The camera only works in the app.", empty:"Type a problem or take a photo first.",
    crash:"Something went wrong. Check the problem and try again.",
    ocr_camera:"Couldn't open the camera. Try Gallery instead.", ocr_open:"Couldn't open that photo. Try another one.",
    ocr_read:"Couldn't read the photo. Try again with better light.",
    positive:n=>n+" must be a number bigger than 0.",
    triIneq:"These three sides can't make a triangle (two sides must add up to more than the third).",
    hypLong:"The hypotenuse must be the longest side.",
    angBig:"Those two angles add up to 180° or more, so they can't be in one triangle.",
  },
  he: {
    sub:"צלמו תרגיל או הקלידו אותו. עובד בלי אינטרנט.", tabSolve:"פתרון", tabGeo:"גאומטריה",
    camera:"צילום", gallery:"גלריה", problemLbl:"התרגיל (אחד בכל שורה, תקנו מה שנקרא לא נכון)",
    examples:"דוגמאות:", solve:"פתור", formulas:"נוסחאות: חוקי חזקות וחוק הפילוג המורחב", answer:"תשובה", shape:"צורה", units:"יחידות", calc:"חשב", noUnits:"ללא יחידות",
    reading:"קורא את התמונה…", noMath:"לא מצאתי תרגיל בתמונה. נסו שוב מקרוב ובתאורה טובה, או הקלידו אותו.",
    checkText:"בדקו את הטקסט ותקנו מה שנקרא לא נכון. אחר כך לחצו פתור.",
    appOnly:"המצלמה עובדת רק באפליקציה.", empty:"הקלידו תרגיל או צלמו קודם.",
    crash:"משהו השתבש. בדקו את התרגיל ונסו שוב.",
    ocr_camera:"לא הצלחתי לפתוח את המצלמה. נסו את הגלריה.", ocr_open:"לא הצלחתי לפתוח את התמונה. נסו תמונה אחרת.",
    ocr_read:"לא הצלחתי לקרוא את התמונה. נסו שוב בתאורה טובה יותר.",
    positive:n=>n+" צריך להיות מספר גדול מ-0.",
    triIneq:"שלוש הצלעות האלה לא יוצרות משולש (סכום כל שתי צלעות צריך להיות גדול מהצלע השלישית).",
    hypLong:"היתר חייב להיות הצלע הארוכה ביותר.",
    angBig:"סכום שתי הזוויות הוא 180° או יותר, לכן הן לא יכולות להיות באותו משולש.",
  },
};
const UNITS = { cm:["cm","ס״מ"], m:["m","מ׳"], mm:["mm","מ״מ"], km:["km","ק״מ"], in:["in","אינץ׳"], ft:["ft","רגל"], "":["","" ] };

let lang = "en";
try { lang = localStorage.getItem("lang") || ((navigator.language||"").match(/^(he|iw)/) ? "he" : "en"); } catch(e) {}
const T = (k, ...a) => { const v = UI[lang][k] ?? UI.en[k]; return typeof v === "function" ? v(...a) : v; };
const pick = (en, he) => lang === "he" ? he : en;

function setLang(l){
  lang = l;
  try { localStorage.setItem("lang", l); } catch(e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === "he" ? "rtl" : "ltr";
  $("langEn").setAttribute("aria-pressed", String(l === "en"));
  $("langHe").setAttribute("aria-pressed", String(l === "he"));
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T(e.dataset.t));
  fillShapes(); fillUnits(); fillFormulas();
  if (statusKey) setStatus(statusKey, statusBad);
  if ($("results").childElementCount) solveNow(true);
  if ($("geoResults").childElementCount) calcGeo(true);
}
$("langEn").onclick = () => setLang("en");
$("langHe").onclick = () => setLang("he");

// ---------- tabs ----------
function tab(which){
  const geo = which === "geo";
  $("tabSolve").setAttribute("aria-selected", String(!geo));
  $("tabGeo").setAttribute("aria-selected", String(geo));
  $("solvePanel").hidden = geo; $("results").hidden = geo || !$("results").childElementCount;
  $("geoPanel").hidden = !geo; $("geoResults").hidden = !geo || !$("geoResults").childElementCount;
}
$("tabSolve").onclick = () => tab("solve");
$("tabGeo").onclick = () => tab("geo");

// ---------- photo ----------
let statusKey = "", statusBad = false;
function setStatus(key, bad){
  statusKey = key; statusBad = !!bad;
  const s = $("ocrStatus"); s.hidden = !key; s.textContent = key ? T(key) : ""; s.classList.toggle("bad", !!bad);
}
$("camera").onclick = () => hasBridge ? Android.takePhoto() : setStatus("appOnly", true);
$("gallery").onclick = () => hasBridge ? Android.pickPhoto() : setStatus("appOnly", true);
window.onPhotoStart = () => setStatus("reading");
window.onPhotoCancelled = () => setStatus("");
window.onOcrError = key => setStatus("ocr_" + key, true);
window.onOcr = text => {
  const lines = String(text).split("\n").map(l => l.trim()).filter(l => /\d|=/.test(l));
  if (!lines.length) { setStatus("noMath", true); return; }
  $("problem").value = lines.join("\n");
  setStatus("checkText");
  solveNow();
};

// ---------- solve ----------
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function dirOf(e, s){ e.dir = HEB.test(s) ? "rtl" : "ltr"; return e; }

const FORMULAS = {
  en:[["Product of powers, same base","aˣ · aʸ = aˣ⁺ʸ"],["Quotient of powers, same base","aˣ : aʸ = aˣ⁻ʸ  (a ≠ 0)"],["Power of a power","(aˣ)ʸ = aˣ·ʸ"],
      ["Exponent 0","a⁰ = 1  (a ≠ 0)"],["Negative exponent","a⁻ⁿ = 1/aⁿ"],["Extended distributive law","(a + c)(b + d) = ab + ad + cb + cd"],
      ["Watch out","A minus or a multiplier before the brackets multiplies every term inside"],["Prime factorization","Type a whole number, e.g. 360"]],
  he:[["מכפלת חזקות בעלות אותו בסיס","aˣ · aʸ = aˣ⁺ʸ"],["מנה של חזקות בעלות אותו בסיס","aˣ : aʸ = aˣ⁻ʸ  (a ≠ 0)"],["חזקה של חזקה","(aˣ)ʸ = aˣ·ʸ"],
      ["חזקה בעלת מעריך 0","a⁰ = 1  (a ≠ 0)"],["חזקה בעלת מעריך שלילי","a⁻ⁿ = 1/aⁿ"],["חוק הפילוג המורחב","(a + c)(b + d) = ab + ad + cb + cd"],
      ["שימו לב","כופל או מינוס לפני הסוגריים כופל כל איבר בפנים"],["פירוק לגורמים ראשוניים","מקלידים מספר שלם, למשל 360"]],
};
function fillFormulas(){
  const box=$("formulaBody"); box.innerHTML="";
  const tb=document.createElement("table");
  FORMULAS[lang].forEach(([name,f])=>{ const tr=document.createElement("tr"); const fc=el("td","f",f); fc.dir = HEB.test(f) ? "rtl" : "ltr"; if (HEB.test(f)) fc.style.whiteSpace="normal"; tr.append(el("td",null,name), fc); tb.append(tr); });
  box.append(tb);
}
function proofTable(rows){
  const W=TW(), wrap=el("div","proofwrap"), tb=document.createElement("table"); tb.className="proof";
  const hr=document.createElement("tr"); ["#", W.claim, W.reason].forEach(h=>hr.append(el("th",null,h)));
  const th=document.createElement("thead"); th.append(hr); tb.append(th);
  const body=document.createElement("tbody");
  rows.forEach(([c,why],i)=>{ const tr=document.createElement("tr");
    tr.append(el("td","n",String(i+1)), dirOf(el("td", HEB.test(c) ? "claim he" : "claim", c), c), dirOf(el("td",null,why), why)); body.append(tr); });
  tb.append(body); wrap.append(tb); return wrap;
}
function solveNow(quiet){
  const out = $("results"); out.innerHTML = "";
  let res;
  try { res = Solver.solve($("problem").value, lang); } catch(e) { res = [{problem:"", error:T("crash")}]; }
  if (!res.length) { out.append(el("p","hint",T("empty"))); out.hidden=false; return; }
  res.forEach((r, i) => {
    const box = el("div","result");
    if (i) out.append(el("hr"));
    box.append(dirOf(el("div","prob",(res.length>1 ? "("+String.fromCharCode(97+i)+")  " : "") + r.problem), ""));
    if (r.error) box.append(dirOf(el("div","err",r.error), r.error));
    else {
      const a = el("div","ans"); a.append(el("small",null,T("answer")), dirOf(el("div",null,r.answer), r.answer)); box.append(a);
      if (r.steps && r.steps.length) box.append(proofTable(r.steps));
    }
    out.append(box);
  });
  out.hidden = $("solvePanel").hidden;
  if (!quiet) out.scrollIntoView({behavior:"smooth", block:"start"});
}
$("solve").onclick = () => solveNow();

// ---------- geometry ----------
const R = v => { let r = Math.round(v*10000)/10000; return String(Object.is(r,-0)?0:r); };
// each result: [name, formula, substituted, value, power(1|2|3|"°"), πcoefficient]
const SH = {
  rect:{l:["Rectangle","מלבן"], f:[["a","Length","אורך"],["b","Width","רוחב"]], calc:v=>[
    [pick("Area","שטח"),pick("length × width","אורך × רוחב"),`${v.a} × ${v.b}`,v.a*v.b,2],
    [pick("Perimeter","היקף"),pick("2 × (length + width)","2 × (אורך + רוחב)"),`2 × (${v.a} + ${v.b})`,2*(v.a+v.b),1],
    [pick("Diagonal","אלכסון"),pick("√(length² + width²)","√(אורך² + רוחב²)"),`√(${v.a}² + ${v.b}²)`,Math.hypot(v.a,v.b),1]]},
  square:{l:["Square","ריבוע"], f:[["a","Side","צלע"]], calc:v=>[
    [pick("Area","שטח"),pick("side²","צלע²"),`${v.a}²`,v.a*v.a,2],
    [pick("Perimeter","היקף"),pick("4 × side","4 × צלע"),`4 × ${v.a}`,4*v.a,1],
    [pick("Diagonal","אלכסון"),pick("side × √2","צלע × √2"),`${v.a} × √2`,v.a*Math.SQRT2,1]]},
  tri:{l:["Triangle (base & height)","משולש (צלע וגובה)"], f:[["b","Base","צלע"],["h","Height","גובה לצלע"]], calc:v=>[
    [pick("Area","שטח"),pick("base × height ÷ 2","צלע × גובה ÷ 2"),`${v.b} × ${v.h} ÷ 2`,v.b*v.h/2,2]]},
  tri3:{l:["Triangle (3 sides)","משולש (3 צלעות)"], f:[["a","Side a","צלע a"],["b","Side b","צלע b"],["c","Side c","צלע c"]], calc:v=>{
    if (v.a+v.b<=v.c||v.a+v.c<=v.b||v.b+v.c<=v.a) throw T("triIneq");
    const s=(v.a+v.b+v.c)/2; return [
    [pick("Perimeter","היקף"),"a + b + c",`${v.a} + ${v.b} + ${v.c}`,v.a+v.b+v.c,1],
    [pick("Half perimeter s","חצי היקף s"),"(a + b + c) ÷ 2",`${R(v.a+v.b+v.c)} ÷ 2`,s,1],
    [pick("Area (Heron)","שטח (נוסחת הרון)"),"√(s(s−a)(s−b)(s−c))",`√(${R(s)} × ${R(s-v.a)} × ${R(s-v.b)} × ${R(s-v.c)})`,Math.sqrt(s*(s-v.a)*(s-v.b)*(s-v.c)),2]];}},
  right:{l:["Right triangle (2 legs)","משולש ישר-זווית (2 ניצבים)"], f:[["a","Leg a","ניצב a"],["b","Leg b","ניצב b"]], calc:v=>{const c=Math.hypot(v.a,v.b); return [
    [pick("Hypotenuse (Pythagoras)","יתר (פיתגורס)"),"√(a² + b²)",`√(${v.a}² + ${v.b}²) = √${R(v.a*v.a+v.b*v.b)}`,c,1],
    [pick("Area","שטח"),"a × b ÷ 2",`${v.a} × ${v.b} ÷ 2`,v.a*v.b/2,2],
    [pick("Perimeter","היקף"),"a + b + c",`${v.a} + ${v.b} + ${R(c)}`,v.a+v.b+c,1]];}},
  rightLeg:{l:["Right triangle (find a leg)","משולש ישר-זווית (מציאת ניצב)"], f:[["c","Hypotenuse","יתר"],["a","Known leg","ניצב ידוע"]], ex:{c:5,a:3}, calc:v=>{
    if (v.a>=v.c) throw T("hypLong");

const TW = () => TRW[lang];
const K4 = ["A","B","C","D"];
function checkAngles(v){ const W=TW(); for (const k of K4) if (v[k]!=null && !(v[k]>0 && v[k]<180)) throw W.range; }

function trapMissing(v){
  const W=TW(); checkAngles(v);
  const given = K4.filter(k=>v[k]!=null);
  if (!given.length) throw W.needLeg;
  const rows = [[W.trap, W.given], [LRI(given.map(k=>"∢"+k+" = "+R(v[k])+"°").join(" ,  ")), W.given]];
  for (const [p,q] of [["A","D"],["B","C"]]) {
    if (v[p]==null && v[q]==null) throw W.needLeg;
    if (v[p]!=null && v[q]!=null) { const x=v[p]+v[q]; if (Math.abs(x-180)>1e-9) throw W.legBad(p,q,R(x)); continue; }
    const [kn, ms] = v[p]!=null ? [p,q] : [q,p];
    v[ms] = 180 - v[kn];
    rows.push([LRI("∢"+ms+" = 180° − ∢"+kn+" = 180 − "+R(v[kn])+" = "+R(v[ms])+"°"), W.legThm]);
  }
  const missing = K4.filter(k=>!given.includes(k));
  if (missing.length) rows.push([LRI("∢A + ∢B + ∢C + ∢D = "+K4.map(k=>R(v[k])).join(" + ")+" = 360° ✓"), W.quad]);
  return { rows, title:W.missing, answer: missing.length ? missing.map(k=>LRI("∢"+k+" = "+R(v[k])+"°")).join("    ") : W.allGiven,
           angles:v, computed:missing, par:[true,false] };
}

function trapCheck(v){
  const W=TW(); checkAngles(v);
  const given = K4.filter(k=>v[k]!=null);
  if (given.length < 3) throw W.need3;
  const rows = [[LRI(given.map(k=>"∢"+k+" = "+R(v[k])+"°").join(" ,  ")), W.given]];
  const sum = given.reduce((t,k)=>t+v[k],0);
  let computed = [];
  if (given.length === 3) {
    if (sum >= 360) throw W.sumBad(R(sum));
    const m = K4.find(k=>v[k]==null); v[m] = 360 - sum; computed=[m];
    if (v[m] >= 180) throw W.range;
    rows.push([LRI("∢"+m+" = 360° − "+given.map(k=>"∢"+k).join(" − ")+" = 360 − "+given.map(k=>R(v[k])).join(" − ")+" = "+R(v[m])+"°"), W.quad]);
  } else if (Math.abs(sum-360) > 1e-9) throw W.sumBad(R(sum));
  const s1 = v.A+v.D, p1 = Math.abs(s1-180) < 1e-9;
  rows.push([LRI("∢A + ∢D = "+R(v.A)+" + "+R(v.D)+" = "+R(s1)+"°"+(p1?"":" ≠ 180°")), W.coint]);
  rows.push([LRI(p1 ? "AB ∥ DC" : "AB ∦ DC"), p1 ? W.par : W.notPar]);
  const s2 = v.A+v.B, p2 = Math.abs(s2-180) < 1e-9;
  rows.push([LRI("∢A + ∢B = "+R(v.A)+" + "+R(v.B)+" = "+R(s2)+"°"+(p2?"":" ≠ 180°")), W.coint]);
  rows.push([LRI(p2 ? "AD ∥ BC" : "AD ∦ BC"), p2 ? W.par : W.notPar]);
  const verdict = p1 !== p2 ? [W.isTrap, W.defTrap] : (p1 ? [W.isPara, W.twoPairs] : [W.notTrap, W.noPairs]);
  rows.push(verdict);
  return { rows, title:W.result, answer:verdict[0], angles:v, computed, par:[p1,p2] };
}

function trapSVG(ang, par, computed){
  const [p1,p2] = par;
  const P = p1 && p2 ? {A:[50,26],B:[190,26],C:[240,124],D:[100,124]}
          : (p1 || p2) ? {A:[75,26],B:[185,26],C:[245,124],D:[20,124]}
          : {A:[70,26],B:[200,44],C:[245,124],D:[20,124]};
  const pts = K4.map(k=>P[k].join(",")).join(" ");
  const off = {A:[-6,-8],B:[6,-8],C:[8,14],D:[-8,14]};
  const inner = k => { const cx=(P.A[0]+P.B[0]+P.C[0]+P.D[0])/4, cy=(P.A[1]+P.B[1]+P.C[1]+P.D[1])/4;
    return [P[k][0]+(cx-P[k][0])*0.22, P[k][1]+(cy-P[k][1])*0.28+5]; };
  const chev = (a,b,n) => { const mx=(P[a][0]+P[b][0])/2, my=(P[a][1]+P[b][1])/2, ang=Math.atan2(P[b][1]-P[a][1],P[b][0]-P[a][0])*180/Math.PI;
    let d=""; for (let i=0;i<n;i++){ const x=mx-3+i*7; d+=`M${x-4},${my-5} L${x+2},${my} L${x-4},${my+5} `; }
    return `<path d="${d}" transform="rotate(${ang} ${mx} ${my})" style="fill:none;stroke:var(--pen);stroke-width:2"/>`; };
  let svg = `<svg viewBox="0 0 270 150" role="img" aria-label="ABCD"><polygon points="${pts}" style="fill:var(--pen-soft);stroke:var(--pen);stroke-width:2.5;stroke-linejoin:round"/>`;
  if (p1) svg += chev("A","B",1) + chev("D","C",1);
  if (p2) svg += chev("A","D",2) + chev("B","C",2);
  for (const k of K4) {
    const [x,y]=P[k], [dx,dy]=off[k], [ix,iy]=inner(k);
    svg += `<text x="${x+dx}" y="${y+dy}" text-anchor="middle" style="fill:var(--ink);font:700 15px var(--sans)">${k}</text>`;
    const known = ang[k]!=null, isNew = computed.includes(k);
    svg += `<text x="${ix}" y="${iy}" text-anchor="middle" style="fill:${isNew?"var(--ok)":"var(--muted)"};font:${isNew?700:500} 13px var(--mono)">${known?R(ang[k])+"°":"?"}</text>`;
  }
  return svg + "</svg>";
}

const R_SUM180 = () => g2("The angles of a triangle add up to 180°","סכום הזוויות במשולש 180°");
const R_BASE = () => g2("In an isosceles triangle, the base angles are equal","במשולש שווה שוקיים זוויות הבסיס שוות");

function isoAngles(v){
  angRange(v,["A","B"]);
  if (v.A==null && v.B==null) throw g2("Enter the vertex angle ∢A or a base angle ∢B.","הכניסו את זווית הראש ∢A או זווית בסיס ∢B.");
  const rows=[[isoGiven(), GV()], givenRow(v,["A","B"])];
  let A=v.A, B=v.B, computed;
  if (A!=null && B!=null) {
    if (Math.abs(A+2*B-180)>1e-9) throw g2("These angles don't fit: in an isosceles triangle ∢A + 2·∢B must be 180°.","הזוויות לא מתאימות: במשולש שווה שוקיים ∢A + 2·∢B חייב להיות 180°.");
    rows.push([LRI("∢C = ∢B = "+R(B)+"°"), R_BASE()]); computed=["C"];
  } else if (A!=null) {
    rows.push([LRI("∢B = ∢C"), R_BASE()]);
    rows.push([LRI("∢B + ∢C = 180° − ∢A = 180 − "+R(A)+" = "+R(180-A)+"°"), R_SUM180()]);
    B=(180-A)/2; rows.push([LRI("∢B = ∢C = "+R(180-A)+"° ÷ 2 = "+R(B)+"°"), g2("Two equal angles: divide by 2","שתי זוויות שוות: מחלקים ב-2")]);
    computed=["B","C"];
  } else {
    if (B>=90) throw g2("A base angle must be less than 90°.","זווית בסיס חייבת להיות קטנה מ-90°.");
    rows.push([LRI("∢C = ∢B = "+R(B)+"°"), R_BASE()]);
    A=180-2*B; rows.push([LRI("∢A = 180° − ∢B − ∢C = 180 − "+R(B)+" − "+R(B)+" = "+R(A)+"°"), R_SUM180()]);
    computed=["A","C"];
  }
  const ang={A,B,C:B};
  return { rows, title:g2("Angles","הזוויות"), answer: LRI("∢A = "+R(A)+"°   ∢B = ∢C = "+R(B)+"°"), svg: isoSVG(ang, computed) };
}

function isoHeight(v){
  lenPos(v,["L","b"]);
  if (v.L==null || v.b==null) throw g2("Enter the leg AB and the base BC.","הכניסו את השוק AB ואת הבסיס BC.");
  const L=v.L, b=v.b;
  if (b >= 2*L) throw g2("The base must be shorter than the two legs together (BC < 2·AB).","הבסיס חייב להיות קצר מסכום שתי השוקיים (BC < 2·AB).");
  const BD=b/2, h2=L*L-BD*BD, AD=Math.sqrt(h2), S=b*AD/2, P=2*L+b, u=usuf;
  const rows=[
    [isoGiven(), GV()],
    [LRI("AB = AC = "+R(L)+" ,  BC = "+R(b)+u(1)), GV()],
    [g2("AD is the median to the base BC", LRI("AD")+" תיכון לבסיס "+LRI("BC")), g2("Construction (draw the median to the base)","בנייה (נעביר את התיכון לבסיס)")],
    [LRI("BD = DC = BC ÷ 2 = "+R(b)+" ÷ 2 = "+R(BD)), g2("A median cuts the side into two equal parts","תיכון חוצה את הצלע לשני חלקים שווים")],
    [LRI("AD ⊥ BC   (∢ADB = 90°)"), g2("In an isosceles triangle, the median to the base is also the height","במשולש שווה שוקיים התיכון לבסיס הוא גם גובה")],
    [LRI("∢BAD = ∢CAD"), g2("In an isosceles triangle, the median to the base also bisects the vertex angle","במשולש שווה שוקיים התיכון לבסיס הוא גם חוצה זווית הראש")],
    [LRI("AD² + BD² = AB²"), g2("Pythagoras in the right triangle ABD","משפט פיתגורס במשולש ישר הזווית "+LRI("ABD"))],
    [LRI("AD = √(AB² − BD²) = √("+R(L)+"² − "+R(BD)+"²) = √"+R(h2)+eqOrApprox(AD)), g2("Substituting the sizes","הצבת גדלים")],
    [LRI("S = BC · AD ÷ 2 = "+R(b)+" · "+R(AD)+" ÷ 2"+eqOrApprox(S)+u(2)), g2("Triangle area = side × height to that side ÷ 2","שטח משולש = צלע × הגובה לצלע ÷ 2")],
    [LRI("P = AB + AC + BC = "+R(L)+" + "+R(L)+" + "+R(b)+" = "+R(P)+u(1)), g2("Perimeter = sum of the sides","היקף = סכום הצלעות")],
  ];
  return { rows, title:g2("Height, area and perimeter","גובה, שטח והיקף"),
    answer: [LRI("AD"+eqOrApprox(AD)+u(1)), LRI("S"+eqOrApprox(S)+u(2)), LRI("P = "+R(P)+u(1))].join("\n"),
    svg: isoSVG(null, [], {height:true, lens:{leg:R(L), half:R(BD), h:"AD"+eqOrApprox(AD).replace(" = ","=").replace(" ≈ ","≈")}}) };
}

function isoCheck(v){
  angRange(v,["A","B","C"]);
  const K=["A","B","C"], given=K.filter(k=>v[k]!=null);
  if (given.length<2) throw g2("Enter at least 2 of the 3 angles.","הכניסו לפחות 2 מתוך 3 הזוויות.");
  const rows=[givenRow(v,K)], computed=[];
  const sum=given.reduce((t,k)=>t+v[k],0);
  if (given.length===2) {
    if (sum>=180) throw g2("Two angles of a triangle must add up to less than 180°.","סכום שתי זוויות במשולש חייב להיות קטן מ-180°.");
    const m=K.find(k=>v[k]==null); v[m]=180-sum; computed.push(m);
    rows.push([LRI("∢"+m+" = 180° − "+given.map(k=>"∢"+k).join(" − ")+" = 180 − "+given.map(k=>R(v[k])).join(" − ")+" = "+R(v[m])+"°"), R_SUM180()]);
  } else if (Math.abs(sum-180)>1e-9) throw g2("The angles add up to "+R(sum)+"°, but a triangle's angles add up to 180°.","סכום הזוויות יוצא "+R(sum)+"°, אבל במשולש הסכום הוא 180°.");
  const same=(a,b)=>Math.abs(v[a]-v[b])<1e-9;
  const OPP={A:"BC",B:"AC",C:"AB"};
  const pairs=[["B","C"],["A","C"],["A","B"]].filter(([a,b])=>same(a,b));
  let ticks=[], verdict;
  if (pairs.length===3) {
    rows.push([LRI("∢A = ∢B = ∢C = 60°"), g2("Substituting the sizes","הצבת גדלים")]);
    rows.push([LRI("AB = BC = AC"), g2("Opposite equal angles lie equal sides","מול זוויות שוות מונחות צלעות שוות")]);
    verdict=[g2("ΔABC is equilateral (so it is also isosceles)", LRI("ΔABC")+" שווה צלעות (ולכן גם שווה שוקיים)"), g2("A triangle with all sides equal is equilateral","משולש שכל צלעותיו שוות נקרא שווה צלעות")];
    ticks=[["A","B",1],["B","C",1],["A","C",1]];
  } else if (pairs.length===1) {
    const [a,b]=pairs[0];
    rows.push([LRI("∢"+a+" = ∢"+b+" = "+R(v[a])+"°"), g2("Substituting the sizes","הצבת גדלים")]);
    const s1=OPP[a], s2=OPP[b];
    rows.push([LRI(s2+" = "+s1), g2("If a triangle has two equal angles, it is isosceles: opposite equal angles lie equal sides","אם במשולש יש שתי זוויות שוות אז הוא שווה שוקיים: מול זוויות שוות מונחות צלעות שוות")]);
    verdict=[g2("ΔABC is isosceles", LRI("ΔABC")+" שווה שוקיים"), g2("A triangle with two equal sides is isosceles","משולש בעל שתי צלעות שוות נקרא שווה שוקיים")];
    ticks=[[s1[0],s1[1],1],[s2[0],s2[1],1]];
  } else {
    verdict=[g2("ΔABC is not isosceles", LRI("ΔABC")+" לא שווה שוקיים"), g2("No two angles are equal, so no two sides are equal","אין בו שתי זוויות שוות, ולכן אין בו שתי צלעות שוות")];
  }
  rows.push(verdict);
  return { rows, title:g2("Result","מסקנה"), answer:verdict[0], svg: isoSVG(v, computed, {ticks}) };
}

const R_KITE_BD = () => g2("In a kite, the angles opposite the main diagonal are equal","בדלתון הזוויות מול האלכסון הראשי שוות זו לזו");
const R_QUAD = () => TW().quad;
function kiteAngles(v){
  const K=["A","B","C","D"]; angRange(v,K);
  const given=K.filter(k=>v[k]!=null);
  if (given.length<2) throw g2("Enter at least 2 angles: ∢A and ∢C, or ∢B (or ∢D) with ∢A or ∢C.","הכניסו לפחות 2 זוויות: ∢A ו-∢C, או ∢B (או ∢D) יחד עם ∢A או ∢C.");
  const rows=[[kiteGiven(), GV()], givenRow(v,K)], computed=[];
  if (v.B!=null && v.D!=null && Math.abs(v.B-v.D)>1e-9) throw g2("In a kite ∢B must equal ∢D.","בדלתון ∢B חייבת להיות שווה ל-∢D.");
  if (v.B!=null || v.D!=null) {
    const [kn,ms]= v.B!=null ? ["B","D"] : ["D","B"];
    if (v[ms]==null) { v[ms]=v[kn]; computed.push(ms); }
    rows.push([LRI("∢"+ms+" = ∢"+kn+" = "+R(v[kn])+"°"), R_KITE_BD()]);
    const miss=["A","C"].filter(k=>v[k]==null);
    if (miss.length===2) throw g2("Also enter ∢A or ∢C.","הכניסו גם את ∢A או את ∢C.");
    if (miss.length===1) {
      const m=miss[0], o=m==="A"?"C":"A"; v[m]=360-v[o]-2*v.B;
      if (!(v[m]>0)) throw TW().sumBad(R(v[o]+2*v.B));
      computed.push(m);
      rows.push([LRI("∢"+m+" = 360° − ∢"+o+" − ∢B − ∢D = 360 − "+R(v[o])+" − "+R(v.B)+" − "+R(v.D)+" = "+R(v[m])+"°"), R_QUAD()]);
    } else if (Math.abs(v.A+v.C+2*v.B-360)>1e-9) throw TW().sumBad(R(v.A+v.C+2*v.B));
  } else {
    if (v.A==null || v.C==null) throw g2("Enter ∢A and ∢C, or one of ∢B / ∢D.","הכניסו את ∢A ואת ∢C, או את ∢B / ∢D.");
    rows.push([LRI("∢B = ∢D"), R_KITE_BD()]);
    const s=360-v.A-v.C; if (!(s>0)) throw TW().sumBad(R(v.A+v.C));
    rows.push([LRI("∢B + ∢D = 360° − ∢A − ∢C = 360 − "+R(v.A)+" − "+R(v.C)+" = "+R(s)+"°"), R_QUAD()]);
    v.B=v.D=s/2; computed.push("B","D");
    rows.push([LRI("∢B = ∢D = "+R(s)+"° ÷ 2 = "+R(v.B)+"°"), g2("Two equal angles: divide by 2","שתי זוויות שוות: מחלקים ב-2")]);
  }
  rows.push([LRI("∢BAC = ∢DAC = ∢A ÷ 2 = "+R(v.A/2)+"°"), g2("The main diagonal bisects the vertex angles","האלכסון הראשי חוצה את זוויות הראש")]);
  rows.push([LRI("∢BCA = ∢DCA = ∢C ÷ 2 = "+R(v.C/2)+"°"), g2("The main diagonal bisects the vertex angles","האלכסון הראשי חוצה את זוויות הראש")]);
  return { rows, title:g2("Angles","הזוויות"), answer: [LRI("∢A = "+R(v.A)+"°   ∢C = "+R(v.C)+"°"), LRI("∢B = ∢D = "+R(v.B)+"°")].join("\n"), svg: kiteSVG(v, computed) };

function kiteArea(v){
  lenPos(v,["d1","d2","S"]);
  const n=["d1","d2","S"].filter(k=>v[k]!=null).length;
  if (n<2) throw g2("Enter 2 of these 3: AC, BD, area.","הכניסו 2 מתוך 3: AC, BD, שטח.");
  const u=usuf, rows=[[kiteGiven(), GV()], [g2("AC is the main diagonal, BD is the other diagonal", LRI("AC")+" האלכסון הראשי, "+LRI("BD")+" האלכסון המשני"), GV()]];
  rows.push([LRI(["d1","d2","S"].filter(k=>v[k]!=null).map(k=>({d1:"AC",d2:"BD",S:"S"})[k]+" = "+R(v[k])).join(" ,  ")), GV()]);
  rows.push([LRI("AC ⊥ BD"), g2("In a kite, the main diagonal is perpendicular to the other diagonal","בדלתון האלכסון הראשי מאונך לאלכסון המשני")]);
  const RA = g2("Kite area = half the product of the diagonals","שטח דלתון = מחצית מכפלת האלכסונים");
  let {d1,d2,S}=v;
  if (d1!=null && d2!=null) {
    const s=d1*d2/2;
    if (S!=null && Math.abs(S-s)>1e-9) throw g2("These numbers don't fit: AC · BD ÷ 2 = "+R(s)+".","המספרים לא מתאימים: AC · BD ÷ 2 = "+R(s)+".");
    S=s; rows.push([LRI("S = AC · BD ÷ 2 = "+R(d1)+" · "+R(d2)+" ÷ 2 = "+R(S)+u(2)), RA]);
  } else if (d1!=null) { d2=2*S/d1; rows.push([LRI("AC · BD ÷ 2 = S  ⇒  BD = 2 · S ÷ AC = 2 · "+R(S)+" ÷ "+R(d1)+" = "+R(d2)+u(1)), RA]); }
  else { d1=2*S/d2; rows.push([LRI("AC · BD ÷ 2 = S  ⇒  AC = 2 · S ÷ BD = 2 · "+R(S)+" ÷ "+R(d2)+" = "+R(d1)+u(1)), RA]); }
  rows.push([LRI("BO = OD = BD ÷ 2 = "+R(d2)+" ÷ 2 = "+R(d2/2)+u(1)), g2("The main diagonal bisects the other diagonal","האלכסון הראשי חוצה את האלכסון המשני")]);
  return { rows, title:g2("Kite","דלתון"), answer: [LRI("S = "+R(S)+u(2)), LRI("AC = "+R(d1)+u(1)), LRI("BD = "+R(d2)+u(1))].join("\n"), svg: kiteSVG(null, [], {diag:true}) };
}

      ol.append(dirOf(el("li",null,l1), l1));
      ol.append(dirOf(el("li",null,"= "+sub), ""));
      const l3 = "= "+LRI((piK!=null ? R(piK)+"π ≈ " : "")+R(value))+u;
      ol.append(dirOf(el("li",null,l3), u));
      box.append(ol); out.append(box);
    }
  } catch(e) { out.append(dirOf(el("div","err",String(e)), String(e))); }
  out.hidden = $("geoPanel").hidden;
  if (!quiet) out.scrollIntoView({behavior:"smooth",block:"start"});
}
$("calc").onclick = () => calcGeo();

// start
setLang(lang);
solveNow(true);
</script>
