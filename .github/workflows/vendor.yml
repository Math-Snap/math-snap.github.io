name: Vendor mathjs
on:
  push:
    branches: [get-mathjs]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p vendor
          curl -fsSL -o vendor/math.js https://cdn.jsdelivr.net/npm/mathjs@12.4.3/lib/browser/math.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f vendor/math.js
          git commit -m "Add math.js for local testing"
          git push
