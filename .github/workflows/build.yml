name: Build APK

on:
  push:
    branches: [main, dev]
    # website-only changes don't make a new app release
    paths-ignore:
      - "docs/index.html"
      - "docs/privacy.html"
      - "docs/sitemap.xml"
      - "docs/robots.txt"
      - "docs/videos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    outputs:
      version: ${{ steps.ver.outputs.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Download the math library
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/math.js https://cdn.jsdelivr.net/npm/mathjs@12.4.3/lib/browser/math.js

      - name: Test the solver
        run: node tests/solver.test.js && node tests/pro.test.js && node tests/science.test.js

      - name: Build the APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MathSnap.apk

      - name: Build the Google Play bundle (only when the upload key is set)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEY_PASSWORD" ]; then
            echo "No upload key in the GitHub secrets yet, skipping the Play Store bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab MathSnap-PlayStore.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Read the app version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Keep the Android files for the release
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            MathSnap.apk
            MathSnap-PlayStore.aab
          if-no-files-found: ignore

  windows:
    # Math Snap for Windows: the same screens, wrapped in an installer (MathSnap-Setup.exe)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Windows app tools
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Copy the app screens and the offline text scanner
        working-directory: desktop
        run: node prepare.js

      - name: Set the version
        working-directory: desktop
        shell: bash
        run: |
          VER=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' ../app/build.gradle.kts)
          # the build number goes last (8.2 → 8.2.49), so every build is newer than the one before
          # and installed copies always see it as an update
          VER="$(echo "$VER" | cut -d. -f1-2).${{ github.run_number }}"
          npm pkg set version="$VER"
          echo "Windows app version $VER"

      - name: Self-test (solve a problem and read a picture)
        working-directory: desktop
        shell: bash
        run: |
          npx electron . --smoke || true
          cat smoke.txt || true
          grep -q '^OK' smoke.txt

      - name: Build the installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build the Microsoft Store package (once the Store name is reserved)
        working-directory: desktop
        shell: bash
        run: |
          if [ -z "$(node -p "require('./package.json').build.appx.identityName")" ]; then
            echo "No Microsoft Store identity yet, skipping the Store package."
          else
            npx electron-builder --win appx --x64 --publish never
          fi

      - name: Check the installer can update itself
        working-directory: desktop
        shell: bash
        run: |
          cat dist/win-unpacked/resources/app-update.yml
          grep -q "releases/latest/download" dist/win-unpacked/resources/app-update.yml
          grep -q "^version:" dist/latest.yml && cat dist/latest.yml

      - name: Keep the Windows files for the release
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/MathSnap-Setup.exe
            desktop/dist/MathSnap-Setup.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/MathSnap-Store.appx

  release:
    # published only when BOTH the Android app and the Windows app built, so every
    # download link on the website always finds its file in the newest release
    needs: [build, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Math Snap ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          body: "Android: MathSnap.apk · Windows: MathSnap-Setup.exe"
          fail_on_unmatched_files: false
          files: |
            out/MathSnap.apk
            out/MathSnap-PlayStore.aab
            out/MathSnap-Setup.exe
            out/MathSnap-Setup.exe.blockmap
            out/latest.yml

